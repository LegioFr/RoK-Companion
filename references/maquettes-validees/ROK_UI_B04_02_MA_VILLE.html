<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>RoK Companion — Ma ville</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif:wght@700&family=Roboto:wght@400..800&display=swap" />
<style>
:root{color-scheme:dark;--canvas:#05070d;--surface:#101928;--surface-2:#172234;--text:#f3ead6;--muted:#b1bbca;--gold:#d8b24c;--gold-2:#f3d982;--gold-soft:rgba(216,178,76,.12);--line:rgba(216,178,76,.22);--line-cold:rgba(154,178,211,.17);--green:#3ecf8e;--amber:#e8b04a;--red:#ff7b7b;--cold:#9dadc4;--display:"Noto Serif",Georgia,"Times New Roman",serif}
*{box-sizing:border-box}
html{min-height:100%}
body{margin:0;min-width:320px;color:var(--text);background:radial-gradient(900px 420px at 50% -8%,rgba(216,178,76,.10),transparent 64%),linear-gradient(180deg,#08111d 0%,#05070d 100%);background-attachment:fixed;font-family:Roboto,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:14px;line-height:1.4}
button,input,select,textarea{font:inherit;color:inherit}a{-webkit-tap-highlight-color:transparent}button{cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
svg{display:block;flex:none;width:24px;height:24px}a{color:inherit;text-decoration:none}
.stage{padding:16px 16px calc(104px + env(safe-area-inset-bottom))}
.app{width:100%;max-width:620px;margin:0 auto}
.screen{padding:16px 14px 18px;border:1px solid var(--line-cold);border-radius:22px;background:linear-gradient(150deg,#111b2b,#0d1522);box-shadow:0 8px 24px #0002}
.header{display:flex;align-items:flex-start;gap:8px;margin-bottom:16px}.header .title-wrap{flex:1;min-width:0}
.title-wrap h1{margin:0;color:var(--gold-2);font:700 32px/1.12 var(--display);overflow-wrap:anywhere}.title-wrap p{margin:7px 0 0;color:var(--muted);font-size:12px}
.back{display:grid;place-items:center;width:44px;height:44px;margin:-4px 0 0 -8px;flex:none;border:0;background:transparent;color:var(--gold-2)}.back svg{width:24px;height:24px}
.demo-note{display:flex;gap:9px;align-items:flex-start;margin:0 0 16px;padding:10px 12px;border:1px dashed var(--line);border-radius:12px;background:#d8b24c0b;color:var(--gold-2);font-size:12px;line-height:1.5}.demo-note svg{width:18px;height:18px;margin-top:1px}
.section-title{display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:5px 10px;margin:22px 0 10px}.section-title:first-child{margin-top:0}.section-title h2{margin:0;font:700 21px/1.15 var(--display)}.section-title .right{font-size:12px;color:var(--muted)}
.panel{border:1px solid var(--line-cold);background:linear-gradient(135deg,#1b283b,#152032);border-radius:14px}
.muted{color:var(--muted)}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
/* Profil actif (repris de B01-07, version condensée) */
.profile-banner{display:flex;align-items:center;gap:10px;padding:12px 10px;margin-bottom:16px;border:1px solid #a9bdd51c;border-radius:19px;background:radial-gradient(ellipse at 0 100%,#ad86331a,transparent 70%),linear-gradient(130deg,#182337,#0e1624)}
.emblem{width:52px;height:52px;flex:none;display:grid;place-items:center;border:1px solid #d2b15e99;border-radius:50%;background:radial-gradient(circle at 35% 25%,#4b4028,#24251f 75%);color:#ead08a}.emblem svg{width:30px;height:30px}
.pb-info{flex:1;min-width:0}.name-row{display:flex;align-items:center;flex-wrap:wrap;gap:5px 8px}.profile-name{font:700 24px/1.12 var(--display)}.profile-meta{margin-top:5px;font-size:11px;color:var(--muted);line-height:1.5}
.pill{display:inline-flex;align-items:center;gap:5px;white-space:nowrap;padding:3px 8px;border:1px solid #3ecf8e47;border-radius:30px;background:#3ecf8e14;color:var(--green);font-size:10px;font-weight:650}.pill i{width:6px;height:6px;background:currentColor;border-radius:50%}
/* Etat de synchronisation P3B-20 */
.sync{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;padding:4px 10px 4px 8px;border:1px solid;border-radius:30px;font-size:11px;font-weight:700;background:transparent}.sync svg{width:14px;height:14px}
.sync.ok{color:var(--green);border-color:#3ecf8e55;background:#3ecf8e14}.sync.pending{color:var(--amber);border-color:#e8b04a66;background:#e8b04a14}.sync.error{color:var(--red);border-color:#ff7b7b66;background:#ff7b7b14}.sync.offline{color:var(--cold);border-color:#9dadc466;background:#9dadc414}
.sync.pending svg{animation:spin 1.4s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){.sync.pending svg{animation:none}}
.meta-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin-bottom:16px;font-size:12px;color:var(--muted)}
/* Listes de valeurs */
.rows{display:grid;gap:8px}
.row{display:flex;align-items:center;gap:11px;width:100%;min-width:0;min-height:64px;padding:10px 10px 10px 12px;text-align:left;border:1px solid var(--line-cold);border-radius:14px;background:linear-gradient(135deg,#1b283b,#152032);color:var(--text)}
.row .ri{flex:none;color:#dfc57e}.row .ri svg{width:24px;height:24px}
.row .rc{flex:1;min-width:0}.row .rn{font-size:13px;font-weight:700;overflow-wrap:anywhere}.row .rm{margin-top:2px;color:var(--muted);font-size:11px;line-height:1.4}
.row .rv{flex:none;max-width:48%;text-align:right;font:700 20px/1.15 var(--display);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.row .rv.big{font-size:15px;letter-spacing:.2px}
.row .rv.unknown{color:#8c98ab}.row .rv small{display:block;margin-top:2px;font:600 12px/1.3 Roboto,system-ui,sans-serif;color:var(--muted)}
.row .go{flex:none;color:var(--gold-2);margin-left:-2px}.row .go svg{width:18px;height:18px}
.row.is-unknown{border-style:dashed}
.legend{display:flex;gap:8px;align-items:flex-start;margin-top:12px;color:var(--muted);font-size:12px;line-height:1.5}.legend svg{width:16px;height:16px;margin-top:2px;color:#dfc57e}
/* Cartes d'accès */
.access-grid{display:grid;gap:10px}
.access{display:flex;flex-direction:column;gap:12px;padding:16px 14px;border:1px solid var(--line);border-radius:18px;background:linear-gradient(135deg,#1d2a40,#152032);color:var(--text)}
.access .top{display:flex;align-items:center;gap:12px}.access .ai{display:grid;place-items:center;width:48px;height:48px;flex:none;border:1px solid #d2b15e66;border-radius:14px;background:#d8b24c12;color:#ead08a}.access .ai svg{width:28px;height:28px}
.access h3{margin:0;font:700 22px/1.15 var(--display)}.access .sub{margin-top:3px;color:var(--muted);font-size:12px}
.access .go{margin-left:auto;color:var(--gold-2)}
.access .facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.fact{padding:9px 10px;border:1px solid var(--line-cold);border-radius:11px;background:#10192888}.fact b{display:block;font:700 20px/1.15 var(--display);font-variant-numeric:tabular-nums}.fact span{display:block;margin-top:2px;color:var(--muted);font-size:11px}
.access .last{color:var(--muted);font-size:11px}
/* Onglets */
.tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-bottom:14px}
.tab{min-height:44px;padding:8px 4px;border:1px solid var(--line);border-radius:12px;background:var(--surface-2);color:var(--muted);font-size:13px;font-weight:800}.tab[aria-pressed="true"]{border-color:var(--gold);background:var(--gold-soft);color:var(--gold-2)}
/* Formulaires, boutons */
.field{margin-top:14px}.field label,.field .lbl{display:block;margin-bottom:6px;color:var(--muted);font-size:12px;font-weight:800}
.field input,.field select,.field textarea{width:100%;min-width:0;height:44px;padding:0 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface-2);font-size:16px}
.field textarea{height:76px;padding:10px 12px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px #d8b24c1a}
.field input:disabled,.field select:disabled,.field textarea:disabled,.chip-btn:disabled{opacity:.55;cursor:not-allowed}
.field .hint{margin-top:6px;color:var(--muted);font-size:11px;line-height:1.5}
.field input.num{font:700 20px/1 var(--display);font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chips .chip-btn{flex:1 1 auto;padding:8px 6px;white-space:nowrap}@media (max-width:767px){.chips .chip-btn{font-size:12px}}@media (max-width:389px){.chips .chip-btn{padding:8px 4px}}
.chip-btn{min-height:44px;padding:8px 8px;border:1px solid var(--line);border-radius:12px;background:var(--surface-2);color:var(--muted);font-size:13px;font-weight:800}.chip-btn[aria-pressed="true"]{border-color:var(--gold);background:var(--gold-soft);color:var(--gold-2)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-width:0;min-height:44px;padding:8px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface-2);color:var(--text);font-size:16px;font-weight:800}
.btn svg{width:18px;height:18px}
.btn.primary{border:0;color:#1c1408;background:linear-gradient(110deg,#c8a44f,#dcc074)}
.btn.danger{border-color:#ff7b7b66;background:#ff7b7b1f;color:#ffb4b4}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.small{min-height:40px;font-size:14px;padding:6px 12px}
.actions{display:grid;grid-template-columns:1fr 1.4fr;gap:8px;margin-top:18px}
.banner{display:flex;gap:10px;align-items:flex-start;padding:12px;border:1px solid;border-radius:14px;font-size:13px;line-height:1.5}.banner svg{width:20px;height:20px;margin-top:1px}.banner b{display:block;margin-bottom:2px}
.banner.error{border-color:#ff7b7b66;background:#ff7b7b14;color:#ffd0d0}.banner.error svg{color:var(--red)}
.banner.offline{border-color:#9dadc466;background:#9dadc414;color:#dbe3ef}.banner.offline svg{color:var(--cold)}
.banner.pending{border-color:#e8b04a66;background:#e8b04a14;color:#f6dcaa}.banner.pending svg{color:var(--amber)}
.banner.ok{border-color:#3ecf8e55;background:#3ecf8e14;color:#c8f3df}.banner.ok svg{color:var(--green)}
.banner .ba{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
/* Historique */
.timeline{display:grid;gap:0;margin:0;padding:0;list-style:none}
.tl{position:relative;padding:0 0 18px 26px}.tl:last-child{padding-bottom:0}
.tl:before{content:"";position:absolute;left:7px;top:14px;bottom:-4px;width:2px;background:var(--line-cold)}.tl:last-child:before{display:none}
.tl:after{content:"";position:absolute;left:1px;top:4px;width:14px;height:14px;border-radius:50%;border:2px solid var(--cold);background:var(--canvas)}
.tl.current:after{border-color:var(--gold);background:var(--gold)}
.tl .card{padding:11px 12px;border:1px solid var(--line-cold);border-radius:13px;background:#10192888}.tl.current .card{border-color:#d8b24caa;background:var(--gold-soft)}
.tl .tv{font:700 22px/1.15 var(--display);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}.tl .tv.big{font-size:16px}
.tl .tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}.tag{padding:2px 8px;border:1px solid var(--line-cold);border-radius:20px;color:var(--muted);font-size:10px;font-weight:700}.tag.gold{border-color:#d8b24c88;color:var(--gold-2)}
.tl dl{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;margin:8px 0 0;font-size:11px;color:var(--muted)}.tl dt{font-weight:700}.tl dd{margin:0;color:var(--text);overflow-wrap:anywhere}
.append-note{margin-top:12px;font-size:11px;color:var(--muted);line-height:1.5}
/* Navigation basse, reprise de B01 */
.bottom-nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom));width:calc(100vw - 32px);max-width:430px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));padding:6px;border-radius:19px;background:#0c1420;border:1px solid #a9bdd52b;box-shadow:0 8px 24px #0005;backdrop-filter:blur(16px);z-index:50}
.nav{border:0;background:transparent;color:#9dadc4;display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:0;min-height:58px;padding:7px 3px;gap:5px;border-radius:12px;font-size:11px;font-weight:600}.nav svg{width:21px;height:21px}.nav.active{color:#edd28b;background:#d8b24c12}
/* Modale */
.overlay{position:fixed;inset:0;display:none;align-items:flex-end;justify-content:center;padding:12px 12px max(12px,env(safe-area-inset-bottom));background:#03070dc9;backdrop-filter:blur(6px);z-index:70}.overlay.open{display:flex}
.sheet{width:min(100%,430px);max-height:100%;overflow-y:auto;background:var(--surface);border:1px solid #d8b24c33;border-radius:22px;padding:16px 18px 18px;box-shadow:0 26px 70px #0009}
.sheet h3{margin:0 0 12px;font-family:var(--display);font-size:20px;color:var(--gold-2);line-height:1.2}.sheet h3:focus{outline:none}.sheet p{margin:0 0 10px;line-height:1.5}
.sheet ul{margin:8px 0 0;padding:0 0 0 18px;color:var(--muted);font-size:13px;line-height:1.6}
body.modal-open{overflow:hidden}
.demo-feedback{margin:14px 0 0;padding:11px 13px;background:#d8b24c0b;border:1px solid var(--line);border-radius:12px;color:var(--gold-2);font-size:13px;line-height:1.5}.demo-feedback:empty{display:none}
.preview-switch{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:16px;padding:10px 12px;border:1px dashed var(--line);border-radius:12px}.preview-switch>span{flex:0 0 100%;color:var(--gold-2);font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.4px}.preview-switch .chip-btn{flex:1 1 120px;min-height:40px;font-size:12px}
.two{display:block}.two>section+section{margin-top:26px}
@media(min-width:700px){
 .stage{padding:28px 32px calc(136px + env(safe-area-inset-bottom))}.app{max-width:920px}.screen{padding:26px;border-radius:28px}.header{margin-bottom:22px}.title-wrap h1{font-size:42px}.title-wrap p{font-size:15px}
 .emblem{width:68px;height:68px}.emblem svg{width:38px;height:38px}.profile-name{font-size:32px}.profile-meta{font-size:13px}.pill{font-size:12px;padding:4px 10px}.sync{font-size:13px}.sync svg{width:16px;height:16px}
 .section-title h2{font-size:26px}.row{min-height:76px;padding:12px 14px;gap:14px}.row .rn{font-size:16px}.row .rm{font-size:13px}.row .rv{font-size:26px}.row .rv.big{font-size:19px}.row .ri svg{width:28px}.row .rv small{font-size:12px}
 .access-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.access{padding:20px}.access h3{font-size:27px}.access .sub{font-size:14px}.fact b{font-size:25px}.fact span{font-size:13px}.access .last{font-size:13px}
 .tab{min-height:52px;font-size:16px}.field label,.field .lbl{font-size:14px}.field input,.field select{height:52px;font-size:18px}.field textarea{font-size:18px}.btn{min-height:52px;font-size:18px}.btn.small{font-size:16px}.banner{font-size:15px}.demo-note{font-size:14px}.legend{font-size:14px}.meta-row{font-size:14px}
 .bottom-nav{width:calc(100vw - 64px);max-width:820px;min-height:88px;padding:8px;border-radius:25px;bottom:calc(18px + env(safe-area-inset-bottom))}.nav{font-size:14px;gap:7px;border-radius:16px}.nav svg{width:28px;height:28px}
 .overlay{padding:24px;align-items:center}.sheet{width:min(100%,620px);padding:28px;border-radius:26px}.sheet h3{font-size:28px;margin-bottom:18px}.sheet p{font-size:16px}.sheet ul{font-size:15px}
 .tl .tv{font-size:28px}.tl .tv.big{font-size:20px}.tl dl{font-size:13px}.tag{font-size:12px}.append-note{font-size:13px}
}
@media(min-width:1100px){
 .two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:28px;align-items:start}.two>section>.section-title:first-child{margin-top:0}.two>section+section{margin-top:0}
}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}

.bottom-nav{grid-template-columns:repeat(5,minmax(0,1fr))}.nav{text-decoration:none}.nav span{display:block}
.nav{font-size:10.5px}@media(min-width:700px){.nav{font-size:14px}}
/* Couleurs de ressources */
.c-ble{color:#e3c25a!important}.c-bois{color:#c08f5d!important}.c-pierre{color:#aab4c2!important}.c-or{color:#f4d03f!important}
.row .ri svg{width:28px;height:28px}
/* Notes de maquette : hors écran */
.mock-bar{margin:0 0 14px;padding:10px 12px;border:1px dashed var(--line);border-radius:14px;background:#d8b24c0b;color:var(--gold-2);font-size:12px;line-height:1.5}
.mock-bar>b{letter-spacing:.2px}.mock-bar details{margin-top:6px}.mock-bar summary{cursor:pointer;font-weight:800;min-height:32px;display:flex;align-items:center}
.mock-bar ul{margin:6px 0 4px;padding-left:18px;color:#e9d9a8}.mock-bar li{margin:3px 0}
.mock-bar .preview-switch{margin:10px 0 0;border-style:solid;background:#05070d66}
.mock-bar .preview-switch>span{flex:0 0 100%}
.hidden{display:none!important}
.grp{margin:16px 0 8px;color:var(--muted);font-size:12px;font-weight:800;letter-spacing:.3px;text-transform:uppercase}
.tabs2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;margin-bottom:16px}
.subtabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-bottom:14px}
.subtabs .tab{min-height:40px;font-size:12px}
.stats3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{min-width:0;padding:12px 8px;border:1px solid var(--line-cold);background:linear-gradient(135deg,#1b283b,#152032);border-radius:14px}
.stat .ico{color:#dfc57e;margin-bottom:8px}.stat .lbl2{color:var(--muted);font-size:11px}.stat .v{margin-top:4px;font:700 clamp(19px,5.4vw,25px)/1.15 var(--display);white-space:nowrap;font-variant-numeric:tabular-nums}
.short{display:flex;align-items:center;gap:12px;min-height:60px;padding:12px;border:1px solid var(--line);border-radius:14px;background:linear-gradient(135deg,#1d2a40,#152032)}
.short .ri{color:#dfc57e;flex:none}.short .rc{flex:1;min-width:0;font-weight:700;font-size:14px}.short .rc small{display:block;margin-top:2px;color:var(--muted);font-weight:500;font-size:12px}.short .go{color:var(--gold-2)}.short .go svg{width:18px}
.short .count{flex:none;display:grid;place-items:center;min-width:34px;height:34px;padding:0 8px;border-radius:17px;background:var(--gold-soft);border:1px solid #d8b24c88;color:var(--gold-2);font:700 18px/1 var(--display)}
.brief{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.brief .row{min-height:60px;padding:8px 10px}.brief .rv{font-size:17px}.brief .rv small{display:none}
.hero-empty{padding:16px;border:1px dashed var(--line);border-radius:16px;background:#d8b24c0b}.hero-empty h3{margin:0 0 6px;font:700 20px/1.2 var(--display);color:var(--gold-2)}.hero-empty p{margin:0;color:var(--muted);line-height:1.5;font-size:13px}
.cur-card{padding:14px;border:1px solid #d8b24caa;border-radius:16px;background:var(--gold-soft)}.cur-card .k{color:var(--muted);font-size:12px}.cur-card .v{margin-top:4px;font:700 34px/1.1 var(--display);font-variant-numeric:tabular-nums}.cur-card .v.unknown{color:#8c98ab}.cur-card .m{margin-top:6px;color:var(--muted);font-size:12px;line-height:1.5}
.approx{margin-top:6px;color:var(--gold-2);font-size:12px;min-height:1.4em}
.err{margin-top:6px;color:var(--red);font-size:12px;min-height:1.4em}
.facts-list{display:grid;gap:8px}.facts-list .row{min-height:60px}
@media(min-width:700px){
 .nav{font-size:14px}.mock-bar{font-size:14px}.short .rc{font-size:17px}.short .rc small{font-size:14px}.short{min-height:76px;padding:14px 18px}.short .count{min-width:42px;height:42px;font-size:22px;border-radius:21px}
 .stat{padding:18px}.stat .lbl2{font-size:14px}.stat .v{font-size:32px}.brief{gap:12px}.brief .row{min-height:72px}.brief .rv{font-size:22px}
 .cur-card .v{font-size:46px}.cur-card .k,.cur-card .m{font-size:14px}.hero-empty h3{font-size:25px}.hero-empty p{font-size:15px}.grp{font-size:14px}.subtabs .tab{min-height:48px;font-size:15px}.approx,.err{font-size:14px}

/* PC (1100 px et plus) : rail vertical fixe à gauche, mêmes 5 entrées ; contenu à pleine largeur (marges latérales),
   aux tailles de la tablette, en colonnes régulières ; blocs à hauteur naturelle, rien n'est étiré. */

 .rows{grid-template-columns:repeat(auto-fill,minmax(var(--col),1fr));gap:12px 24px}
 .resbody .rows{grid-template-columns:minmax(0,1fr);gap:8px}
 /* Ma ville, Progression : Réglages et Bâtiments côte à côte, chacun sur deux colonnes. */
 .two{grid-template-columns:repeat(12,minmax(0,1fr));gap:24px 32px}
 .two>section:not(:has(#curCard)){grid-column:span 6}
 /* Ma ville, Inventaire : une colonne par carte (ressource, type d'accélérateur), à hauteur naturelle. */
 #gRes,#gAcc{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--col),1fr));gap:16px 24px;align-items:start}
 #gRes>.rescard+.rescard,#gAcc>.rescard+.rescard{margin-top:0}

<script>/* Écran large (2400 px et plus) : échelle selon la hauteur disponible, plafonnée à 1,6 (docs/ux/README.md). */
(()=>{const ZMAX=1.6;function ajusterEchelle(){const b=document.body,app=document.querySelector('.app');if(innerWidth<2400){b.style.removeProperty('--z');return}let z=1;b.style.setProperty('--z',1);const dispo=innerHeight-60;for(let k=0;k<6;k++){const h=app.getBoundingClientRect().height;z=Math.max(1,Math.min(ZMAX,z*dispo/h));b.style.setProperty('--z',z.toFixed(3))}while(z>1&&app.getBoundingClientRect().height>dispo){z-=0.01;b.style.setProperty('--z',z.toFixed(3))}}
