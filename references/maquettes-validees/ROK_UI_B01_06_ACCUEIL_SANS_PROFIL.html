/* ===== Révision visuelle (v7 validée par Mickaël le 2026-10-04) ===== */
/* Même police partout, celle du rendu Android : Noto Serif (titres, chiffres) et Roboto (texte). */
body{--display:"Noto Serif",Georgia,"Times New Roman",serif;font-family:Roboto,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}

/* Navigation (choix « B » de Mickaël) — téléphone et tablette : barre collée en bas, pleine largeur,
   fond opaque, trait fin en haut, zone sûre respectée. La page réserve exactement sa hauteur :
   la dernière section s'arrête juste au-dessus et rien n'apparaît autour de la barre. */
body{--nav-h:67px}
body .stage{padding-bottom:calc(var(--nav-h) + 16px + env(safe-area-inset-bottom))}
html{scroll-padding-bottom:calc(var(--nav-h) + 12px + env(safe-area-inset-bottom))}
body .bottom-nav{left:0;right:0;bottom:0;transform:none;width:auto;max-width:none;min-height:0;padding:4px 6px calc(4px + env(safe-area-inset-bottom));border:0;border-top:1px solid #a9bdd52b;border-radius:0;background:#0c1420;box-shadow:none;backdrop-filter:none}
@media(min-width:700px){
 body{--nav-h:82px}
 body .stage{padding-bottom:calc(var(--nav-h) + 28px + env(safe-area-inset-bottom))}
 body .bottom-nav{padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
 body .nav{min-height:64px}
}


/* Sélecteur de profils compact : remplace les 4 grandes cases de B01-07. */
body .profile-strip{display:none}
body .header{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:14px 20px}
body .p-tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr)) 48px;gap:4px;width:100%;padding:4px;border:1px solid var(--line-cold);border-radius:14px;background:#10192888}
body .p-tab{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-width:0;min-height:44px;padding:6px 8px;border:1px solid transparent;border-radius:11px;background:transparent;color:var(--muted);font-size:14px;font-weight:700;white-space:nowrap}
body .p-tab svg{width:18px;height:18px;color:#d9bf79}
body .p-tab[aria-pressed="true"]{border-color:#d8b24caa;background:var(--gold-soft);color:var(--gold-2)}
body .p-tab.add{color:var(--gold-2)}
/* Téléphone : sous le titre, toutes les entrées visibles d'un coup (pas de défilement caché) ; icônes masquées sauf « + ». */
@media(min-width:700px){
 body .p-tabs{display:flex;width:auto}
 body .p-tab{padding:6px 14px 6px 11px;font-size:15px}
}
/* Bloc du profil : la zone mise en avant. Haut compact, puis 5 chiffres
   traités pareil en colonnes égales séparées par un trait fin. « Mes statistiques » disparaît en tant que
   section ; HDV et VIP restent dans la ligne sous le nom. Tout le bloc ouvre la fiche du profil. */
body .title-wrap p{display:none}
body #heroMeta{display:none}
body .statistics{display:none}
body .profile-banner{cursor:pointer;padding:14px 12px;border-color:#d8b24c66;background:radial-gradient(ellipse at 0 0,#d8b24c26,transparent 62%),linear-gradient(130deg,#1b2638,#0e1624)}
body .profile-main{align-items:flex-start;gap:10px}
body .emblem{width:44px;height:44px}body .emblem svg{width:26px;height:26px}
body .profile-name{font-size:22px}
body .profile-meta{margin-top:3px;font-size:12px}
body .chev{min-height:30px;margin-top:-1px}
body .p-kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px 10px;margin-top:14px;padding-top:12px;border-top:1px solid #d8b24c33}
/* Téléphone : grille 3 × 2 complète, sans traits verticaux, colonnes alignées d'une ligne à l'autre. */
body .p-kpi{min-width:0}
body .p-kpi .trend{white-space:nowrap;font-size:clamp(11px,3.1vw,12px)}
body .p-kpi .label{display:flex;align-items:center;gap:5px;white-space:nowrap}
body .p-kpi .value{font-size:clamp(19px,5.2vw,24px)}
body .p-ki{display:block;color:#dfc57e}body .p-ki svg{width:16px;height:16px}
body .p-kpi .trend{margin-top:3px}
@media(min-width:700px){
 body .profile-banner{padding:20px 22px}
 body .profile-main{gap:14px}
 body .emblem{width:56px;height:56px}body .emblem svg{width:32px;height:32px}
 body .profile-name{font-size:30px}
 body .profile-meta{font-size:14px}
 body .chev{min-height:40px}
 body .p-kpis{grid-template-columns:repeat(6,minmax(0,1fr));gap:0;margin-top:18px;padding-top:16px}
 body .p-kpi{padding:0 6px;border-left:1px solid #a9bdd526}
 body .p-kpi:first-child{padding-left:0;border-left:0}
 body .p-kpi:last-child{padding-right:0}
 body .p-kpi .trend{font-size:11.5px;letter-spacing:-.01em}
 body .p-kpi .value{font-size:22px}
 body .p-kpi .label{font-size:12px;white-space:normal;align-items:flex-start;min-height:2.6em}
 body .p-kpi .p-ki svg{width:16px;height:16px}
 body .p-ki svg{width:20px;height:20px}
}
/* Téléphone : « Accueil » plus petit avec « + Ajouter » à sa droite ; la barre d'onglets ne contient que les profils
   (défilement horizontal interne s'il y en a beaucoup, jamais de débordement de page). */
body .p-addtop{display:none}
@media(max-width:699px){
 body .title-wrap h1{font-size:30px}
 body .p-addtop{display:inline-flex;align-items:center;gap:5px;min-height:44px;padding:0 12px 0 9px;border:1px solid #d8b24c88;border-radius:12px;background:transparent;color:var(--gold-2);font-size:13px;font-weight:600}
 body .p-addtop svg{width:15px;height:15px}
 /* Onglets de largeurs égales (l'actif n'est pas plus large) ; défilement interne s'il y a beaucoup de profils. */
 body .p-tabs{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(max-content,1fr);overflow-x:auto;overscroll-behavior-x:contain;scrollbar-width:none}
 body .p-tabs::-webkit-scrollbar{display:none}
 body .p-tab{padding:6px 12px}
 /* Plus de grand cadre : contenu à pleine largeur avec la marge latérale de la page. */
 body .screen{padding:0;border:0;border-radius:0;background:none;box-shadow:none}
 body .p-tab.add{display:none}
 body .p-tab:not(.add) svg{display:none}
}

/* PC (1100 px et plus) : barre verticale fixe à gauche (rail), mêmes 5 entrées ; plus de barre en bas.
   Le contenu occupe toute la largeur restante, aux tailles et espacements de la tablette (768),
   avec plus de colonnes. */
@media(min-width:1100px){
 body{--rail-w:104px;--gutter:clamp(32px,3.5vw,96px);--z:1}
 body .stage{padding:28px var(--gutter) 28px calc(var(--rail-w) * var(--z) + var(--gutter))}
 html{scroll-padding-bottom:0}
 body .bottom-nav{top:0;bottom:0;left:0;right:auto;width:var(--rail-w);grid-template-columns:1fr;grid-auto-rows:min-content;align-content:start;gap:8px;padding:24px 10px;border-top:0;border-right:1px solid #a9bdd52b}
 body .nav{min-height:76px;padding:8px 4px;gap:7px;border-radius:16px;font-size:14px}
 body .nav svg{width:28px;height:28px}
 body .app{max-width:none}
 /* Plus de grand cadre : le contenu est posé sur le fond, à côté du rail. */
 body .screen{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:24px 32px;align-items:start;padding:0;border:0;border-radius:0;background:none;box-shadow:none}
 body .header{grid-column:1/-1;margin:0}
 body .dashboard-group{margin:0}
 /* Hauteurs naturelles, colonnes indépendantes : tous les blocs d'une colonne partagent la même cellule et se
    placent sous le précédent grâce aux hauteurs mesurées (--bh, --ch, --ph, posées par le script). */
 body{--sec-gap:28px}
 body .profile-banner,body .watch{grid-column:1/8;grid-row:2}
 body .cityq,body .progression,body .events{grid-column:8/-1;grid-row:2}
 body .watch{margin-top:calc(var(--bh,0px) + var(--sec-gap))}
 body .progression{margin-top:calc(var(--ch,0px) + var(--sec-gap))}
 body .events{margin-top:calc(var(--ch,0px) + var(--ph,0px) + var(--sec-gap) * 2)}
 body .cityq .mini-stats{grid-template-columns:repeat(3,minmax(0,1fr))}
 body .events .event{padding-block:14px}
 body .p-kpi{padding:0 12px}
 body .p-kpi:first-child{padding-left:0}
 body .p-kpi:last-child{padding-right:0}
 body .p-kpi .value{font-size:28px}
 body .p-kpi .label{font-size:13px;white-space:nowrap;min-height:0;align-items:center}
 body .p-kpi .trend{font-size:14px}
 body .p-kpi .p-ki svg{width:18px;height:18px}
 body .demo-feedback{grid-column:1/-1;margin:0}
}
/* Écran large : même principe ; échelle calculée pour occuper la hauteur disponible sans la dépasser
   (variable --z, posée par le script) ; blocs côte à côte alignés à la même hauteur. */
@media(min-width:2400px){
 body{--gutter:clamp(96px,3vw,140px)}
 body .app{zoom:var(--z)}
 body .profile-banner,body .watch{grid-column:1/7}
 body .cityq,body .progression,body .events{grid-column:7/-1}
}


/* ===== Accueil sans profil (révision B01, revue de Mickaël du 2026-10-04) : structure de B04-01. =====
   Rangée d'onglets réduite à « + Ajouter » ; carte « Aucun profil RoK » à la place et dans le style du bloc du profil ;
   pas d'« Aperçu de ma ville » ni de « Progression ». */
body .empty-banner{cursor:default}
body .empty-banner .profile-main{display:flex;align-items:flex-start}
body .empty-banner .profile-info{flex:1;min-width:0}
body .empty-banner .profile-name{margin:0;font-weight:700;font-family:var(--display);color:var(--text)}
body .empty-banner .profile-meta{color:var(--muted)}
body .empty-actions{margin-top:14px;padding-top:14px;border-top:1px solid #d8b24c33}
body .empty-actions .create{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:10px 22px;border:0;border-radius:12px;color:#1c1408;font-size:15px;font-weight:750;background:linear-gradient(110deg,#c8a44f,#dcc074)}
@media(max-width:699px){body .p-tabs{display:none}body .empty-actions .create{width:100%}}
@media(min-width:700px){body .empty-actions{margin-top:18px;padding-top:18px}body .empty-actions .create{min-height:52px;padding:10px 28px;font-size:17px}}
@media(min-width:1100px){body .empty-banner{grid-column:1/8;grid-row:2}}
@media(min-width:2400px){body .empty-banner{grid-column:1/7}}
</style>
</head>
<body>
<div class="stage">
  <main class="app" aria-label="Accueil sans profil RoK Companion">
    <div class="screen">
      <header class="header">
        <div class="title-wrap"><h1>Accueil</h1></div>
        <button class="p-only p-addtop" type="button" onclick="openAdd()" aria-label="Ajouter un profil"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v16M4 12h16"/></svg><span>Ajouter</span></button>
        <div class="p-only p-tabs" role="group" aria-label="Profils"><button class="p-tab add" type="button" onclick="openAdd()" aria-label="Ajouter un profil"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v16M4 12h16"/></svg><span>Ajouter</span></button></div>
      </header>
      <section class="profile-banner empty-banner" aria-labelledby="emptyTitle">
        <div class="profile-main">
          <div class="emblem"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m4 8 4 3 4-7 4 7 4-3-2 10H6L4 8Z"/><path d="M7 21h10"/></svg></div>
          <div class="profile-info">
            <h2 class="profile-name" id="emptyTitle">Aucun profil RoK</h2>
            <p class="profile-meta">Crée ton premier profil pour afficher ton tableau de bord.</p>
          </div>
        </div>
        <div class="empty-actions"><button class="create" type="button" onclick="openAdd()">Créer mon premier profil</button></div>
      </section>
      <p class="demo-feedback" id="profileStatus" role="status" aria-live="polite" aria-atomic="true"></p>
    </div>
    <nav class="bottom-nav" aria-label="Navigation principale"><a class="nav active" href="ROK_UI_B01_06_ACCUEIL_SANS_PROFIL.html" aria-current="page"><span class="nic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" stroke-width="1.7"><path d="m3 10 9-7 9 7"/><path d="M5 9v12h5v-7h4v7h5V9"/></svg></span><span>Accueil</span></a><button class="nav" type="button" data-demo="Ma ville"><span class="nic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" stroke-width="1.7"><path d="M3 21h18M5 21V9h3V6h3v3h2V6h3v3h3v12M10 21v-5h4v5"/></svg></span><span>Ma ville</span></button><button class="nav" type="button" data-demo="Optimiser"><span class="nic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" stroke-width="1.7"><path d="M3 7h4m5 0h9M3 17h9m5 0h4"/><circle cx="9.5" cy="7" r="2.5"/><circle cx="14.5" cy="17" r="2.5"/></svg></span><span>Optimiser</span></button><button class="nav" type="button" data-demo="Combat"><span class="nic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" stroke-width="1.7"><path d="m8 13 9-9 4-1-1 4-9 9Z"/><path d="m5 12 7 7m-3.5-3.5-4 4M3 18l3 3"/></svg></span><span>Combat</span></button><a class="nav" href="ROK_UI_B01_09_PLUS_PARAMETRES.html"><span class="nic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" stroke-width="1.7"><circle cx="5" cy="12" r="1.6" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.6" fill="currentColor" stroke="none"/><circle cx="19" cy="12" r="1.6" fill="currentColor" stroke="none"/></svg></span><span>Plus</span></a></nav>
  </main>
</div>

<div class="overlay" id="addOverlay" onclick="if(event.target===this)closeAdd()">
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="addTitle">
    <h3 id="addTitle" tabindex="-1">Créer mon premier profil</h3>
    <div class="sheet-body">

    <div class="field">
      <label for="profileName">Nom du profil</label>
      <input id="profileName" placeholder="Ex. Principal" />
    </div>

    <div class="field">
      <label>Type</label>
      <div class="types">
        <button class="type-btn selected" aria-pressed="true" onclick="pickType(this)">Principal</button>
        <button class="type-btn" aria-pressed="false" onclick="pickType(this)">Ferme</button>
        <button class="type-btn" aria-pressed="false" onclick="pickType(this)">Secondaire</button>
      </div>
    </div>

    <div class="field">
      <label for="playerId">ID joueur RoK — facultatif</label>
      <input id="playerId" placeholder="Ex. 123456789" inputmode="numeric" />
    </div>

    </div>
    <div class="sheet-actions">
      <button class="btn" onclick="closeAdd()">Annuler</button>
      <button class="btn primary" onclick="closeAdd();announce('Démonstration : profil créé.')">Créer le profil</button>
    </div>
  </div>
</div>

<script>
const addOverlay=document.getElementById('addOverlay');
let previousFocus;
let viewportFrame=0;
function updateModalViewport(){
 if(!addOverlay.classList.contains("open"))return;
 const viewport=window.visualViewport;
 addOverlay.style.setProperty("--modal-height",(viewport?viewport.height:window.innerHeight)+"px");
 addOverlay.style.setProperty("--modal-width",(viewport?viewport.width:window.innerWidth)+"px");
 addOverlay.style.setProperty("--modal-top",(viewport?viewport.offsetTop:0)+"px");
 addOverlay.style.setProperty("--modal-left",(viewport?viewport.offsetLeft:0)+"px");
 const active=document.activeElement;
 const sheet=addOverlay.querySelector(".sheet-body");
 if(active&&sheet.contains(active)&&active.matches("input,button")){
  const bounds=sheet.getBoundingClientRect();
  const field=active.getBoundingClientRect();
  if(field.bottom>bounds.bottom-12)sheet.scrollTop+=field.bottom-bounds.bottom+12;
  else if(field.top<bounds.top+12)sheet.scrollTop-=bounds.top+12-field.top;
 }
}
function scheduleModalViewport(){
 if(!addOverlay.classList.contains("open"))return;
 cancelAnimationFrame(viewportFrame);
 viewportFrame=requestAnimationFrame(updateModalViewport);
}
if(window.visualViewport){
 window.visualViewport.addEventListener("resize",scheduleModalViewport);
 window.visualViewport.addEventListener("scroll",scheduleModalViewport);
}
window.addEventListener("resize",scheduleModalViewport);
addOverlay.addEventListener("focusin",scheduleModalViewport);
function openAdd(){
 previousFocus=document.activeElement;
 addOverlay.classList.add("open");
 document.body.classList.add("modal-open");
 document.querySelector(".stage").inert=true;
 updateModalViewport();
 addOverlay.querySelector(".sheet-body").scrollTop=0;
 document.getElementById("addTitle").focus({preventScroll:true});
}
function closeAdd(){
 cancelAnimationFrame(viewportFrame);
 addOverlay.classList.remove("open");
 document.body.classList.remove("modal-open");
 document.querySelector(".stage").inert=false;
 if(previousFocus)previousFocus.focus({preventScroll:true});
}
function pickType(el){
  document.querySelectorAll(".type-btn").forEach(button=>{
    const selected=button===el;
    button.classList.toggle("selected",selected);
    button.setAttribute("aria-pressed",String(selected));
  });
}
document.addEventListener("keydown",event=>{
 if(!addOverlay.classList.contains("open"))return;
 if(event.key==="Escape"){event.preventDefault();closeAdd();}
 if(event.key==="Tab"){
  const fields=Array.from(addOverlay.querySelectorAll("input,button"));
  const first=fields[0],last=fields[fields.length-1];
  if(event.shiftKey&&(document.activeElement===first||document.activeElement===document.getElementById("addTitle"))){event.preventDefault();last.focus();}
  else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus();}
 }
});
function announce(message){
 const status=document.getElementById('profileStatus');
 status.textContent=message;
 if(!message)return;
 const bounds=status.getBoundingClientRect(),nav=document.querySelector('.bottom-nav').getBoundingClientRect();
 const bottom=Math.min(window.innerHeight,nav.top)-12;
 if(bounds.bottom>bottom)window.scrollBy({top:bounds.bottom-bottom,behavior:'instant'});
 else if(bounds.top<12)window.scrollBy({top:bounds.top-12,behavior:'instant'});
}
document.querySelectorAll('[data-demo]').forEach(button=>button.addEventListener('click',()=>announce('Démonstration : ouverture de l’écran '+button.dataset.demo+'.')));
// Sur PC, avec le rail à gauche : le message de démonstration est simplement amené à l'écran.
const _announce=announce;announce=function(m){if(matchMedia('(min-width:1100px)').matches){const s=document.getElementById('profileStatus');s.textContent=m;if(m)s.scrollIntoView({block:'nearest'});return}_announce(m)};
// États ouverts par fragment d’adresse : #creer (création du premier profil).
function etatDepuisAdresse(){if(location.hash==='#creer'&&!addOverlay.classList.contains('open'))openAdd();}
addEventListener('hashchange',etatDepuisAdresse);etatDepuisAdresse();
</script>
<script>/* Écran large (2400 px et plus) : échelle selon la hauteur disponible, plafonnée à 1,6 (docs/ux/README.md). */
(()=>{const ZMAX=1.6;function ajusterEchelle(){const b=document.body,app=document.querySelector('.app');if(innerWidth<2400){b.style.removeProperty('--z');return}let z=1;b.style.setProperty('--z',1);const dispo=innerHeight-60;for(let k=0;k<6;k++){const h=app.getBoundingClientRect().height;z=Math.max(1,Math.min(ZMAX,z*dispo/h));b.style.setProperty('--z',z.toFixed(3))}while(z>1&&app.getBoundingClientRect().height>dispo){z-=0.01;b.style.setProperty('--z',z.toFixed(3))}}
addEventListener('resize',ajusterEchelle);addEventListener('hashchange',()=>requestAnimationFrame(ajusterEchelle));document.addEventListener('click',()=>requestAnimationFrame(ajusterEchelle));document.fonts&&document.fonts.ready.then(ajusterEchelle);ajusterEchelle()})();</script>
</body>
