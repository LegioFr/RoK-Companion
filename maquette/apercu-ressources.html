<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Ressources, style moderne</title>
<!-- Page d'aperçu (2026-10-10) : l'onglet Ressources de l'Inventaire dans un style moderne, refait avec la méthode du skill « dataviz »
     à la demande de Mickaël. Couleurs des 4 ressources vérifiées par scripts/validate_palette.js (mode sombre, surface #141922) :
     #199e70 nourriture, #d95926 bois, #3987e5 pierre, #c98500 or — bande de clarté, saturation, daltonisme (pire voisin ΔE 9,4),
     vision normale (26,5) et contraste : tout PASSE. Ce n'est pas l'appli : nombres de la version « Exemples ». -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{color-scheme:dark;
  --page:#0b0e14;--surface:#141922;--surface-2:#1a2030;--hair:rgba(255,255,255,.08);--grid:#252b38;
  --ink:#f0efec;--ink-2:#b9c0cc;--muted:#8b93a3;
  /* séries : une couleur par ressource, dans l'ordre du jeu, validée */
  --food:#199e70;--wood:#d95926;--stone:#3987e5;--gold:#c98500;
  --ui:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box}html,body{margin:0}
body{min-height:100vh;background:var(--page);color:var(--ink);font:15px/1.45 var(--ui);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(900px 420px at 50% -15%,rgba(232,198,106,.07),transparent 70%)}
svg{display:block;flex:none}button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
.wrap{max-width:1000px;margin:0 auto;padding:28px 20px 80px}
@media(max-width:600px){.wrap{padding:20px 14px 60px}}

/* en-tête */
.hd{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:18px}
.hd h1{margin:0;font-size:36px;font-weight:700;letter-spacing:-.025em;line-height:1}
.hd p{margin:8px 0 0;color:var(--muted);font-size:14px}
.btn{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 18px;border:1px solid var(--hair);border-radius:12px;background:var(--surface);color:var(--ink);font-weight:600;font-size:14px}
.btn svg{width:18px;height:18px}
@media(max-width:600px){.hd h1{font-size:30px}.btn span{display:none}.btn{width:44px;padding:0;justify-content:center}}
.seg{display:flex;gap:2px;width:max-content;max-width:100%;overflow-x:auto;margin-bottom:22px;padding:4px;border:1px solid var(--hair);border-radius:12px;background:var(--surface);scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:none;min-height:36px;padding:0 14px;border:0;border-radius:8px;background:none;color:var(--muted);font-weight:500;font-size:14px;cursor:default}
.seg button.on{background:var(--surface-2);color:var(--ink);box-shadow:inset 0 0 0 1px var(--hair)}

/* cartes */
.card{position:relative;padding:22px;border:1px solid var(--hair);border-radius:20px;background:var(--surface);box-shadow:0 1px 0 rgba(255,255,255,.03) inset,0 20px 40px -30px #000}
.in{animation:in .6s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:var(--d,0s)}
@keyframes in{from{opacity:0;transform:translateY(10px)}}
.c-h{display:flex;align-items:center;justify-content:space-between;gap:12px}
.c-t{display:flex;align-items:center;gap:10px;font-weight:600;font-size:16px}
.c-t svg{width:28px;height:28px}
.tbl-b{min-height:32px;padding:0 10px;border:1px solid var(--hair);border-radius:8px;background:none;color:var(--muted);font-size:12.5px;font-weight:500}
.tbl-b[aria-pressed="true"]{color:var(--ink);background:var(--surface-2)}
.lab{color:var(--ink-2);font-size:13px;font-weight:500}

/* chiffre principal et chiffres clés : une seule police, chiffres proportionnels */
.hero{margin-top:10px;font-size:56px;font-weight:600;letter-spacing:-.03em;line-height:1}
.hero small,.val small{margin-left:4px;color:var(--ink-2);font-size:.45em;font-weight:500;letter-spacing:0}
.kpis{display:flex;flex-wrap:wrap;gap:12px 36px;margin-top:18px}
.kpi{display:grid;gap:3px}
.kpi b{font-size:22px;font-weight:600;letter-spacing:-.02em}
.kpi span{color:var(--muted);font-size:13px}
@media(max-width:600px){.hero{font-size:48px}.kpis{gap:12px 26px}}

/* barre empilée (part de chaque ressource) : 20 px, 2 px d'écart couleur du fond, bout arrondi à droite seulement */
.stack{display:flex;gap:2px;height:20px;margin:22px 0 12px}
.stack .s{position:relative;display:flex;align-items:center;justify-content:center;min-width:4px;background:var(--c);outline:none;transform-origin:left;animation:grow .9s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(.2s + var(--k)*.06s)}
.stack .s:last-child{border-radius:0 4px 4px 0}
.stack .s::before{content:"";position:absolute;inset:-4px 0}
.stack .s:hover,.stack .s:focus-visible{filter:brightness(1.18)}
.stack .s em{font-style:normal;font-size:12px;font-weight:600;white-space:nowrap;pointer-events:none;visibility:hidden}
@keyframes grow{from{transform:scaleX(0)}}
.legend{display:flex;flex-wrap:wrap;gap:8px 22px}
.legend span{display:inline-flex;align-items:center;gap:8px;color:var(--ink-2);font-size:13.5px}
.legend b{color:var(--ink);font-weight:600}
.sw{width:10px;height:10px;border-radius:2px;background:var(--c);flex:none}
.sw.dim{background:var(--cd)}

/* cartes des ressources */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:16px}
@media(max-width:700px){.grid{grid-template-columns:minmax(0,1fr)}}
.rc .val{margin-top:14px;font-size:40px;font-weight:600;letter-spacing:-.03em;line-height:1}
.rc .sub{margin-top:6px;color:var(--muted);font-size:13.5px}
/* jauge : en ville (couleur de la ressource) puis en caisses (pas plus sombre de la même couleur) */
.meter{display:flex;gap:2px;height:8px;margin:18px 0 10px}
.meter i{position:relative;display:block;outline:none;transform-origin:left;animation:grow .9s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(var(--d,0s) + .25s)}
.meter i::before{content:"";position:absolute;inset:-9px 0}
.meter .a{background:var(--c)}
.meter .b{background:var(--cd);border-radius:0 4px 4px 0}
.meter i:hover,.meter i:focus-visible{filter:brightness(1.2)}
.mk{display:flex;justify-content:space-between;gap:12px;color:var(--ink-2);font-size:13.5px}
.mk span{display:inline-flex;align-items:center;gap:7px}.mk b{color:var(--ink);font-weight:600}
/* caisses : barres horizontales fines, même échelle pour les 4 ressources */
.cais{margin-top:18px;padding-top:16px;border-top:1px solid var(--grid)}
.cais .lab{margin-bottom:8px}
.br{display:grid;grid-template-columns:96px minmax(0,1fr);align-items:center;gap:12px;min-height:28px}
.br .k{font-size:13.5px;font-weight:500;font-variant-numeric:tabular-nums}
.br .k small{margin-left:5px;color:var(--muted);font-weight:400}
.br .t{display:flex;align-items:center;gap:8px;height:28px;border-left:1px solid var(--grid)}
.br .t i{display:block;flex:none;height:12px;border-radius:0 4px 4px 0;background:var(--c);outline:none;transform-origin:left;animation:grow .8s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(var(--d,0s) + .3s + var(--k)*.06s)}
.br{outline:none;border-radius:6px}.br:hover .t i,.br:focus-visible .t i{filter:brightness(1.2)}.br:focus-visible{box-shadow:0 0 0 2px var(--surface),0 0 0 3px var(--ink-2)}
.br .t b{font-size:13.5px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}

/* gemmes, coffres, packs : le chiffre suffit */
.row3{display:grid;grid-template-columns:1.25fr 1fr 1fr;gap:16px;margin-top:16px}
@media(max-width:700px){.row3{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.row3 .gem{grid-column:1/-1}}
.mini .val{margin-top:12px;font-size:32px;font-weight:600;letter-spacing:-.025em;line-height:1}
.mini .sub{margin-top:6px;color:var(--muted);font-size:13px}

/* vue en tableau : la même information sans graphique */
table{width:100%;margin-top:14px;border-collapse:collapse;font-size:13.5px}
th,td{padding:8px 4px;border-bottom:1px solid var(--grid);text-align:right;font-variant-numeric:tabular-nums}
th:first-child,td:first-child{text-align:left}
th{color:var(--muted);font-weight:500}
[hidden]{display:none!important}

/* infobulle : la valeur d'abord, le nom ensuite, un petit trait de la couleur */
.tip{position:fixed;z-index:30;min-width:140px;padding:10px 12px;border:1px solid var(--hair);border-radius:10px;background:#1d2433;box-shadow:0 12px 30px -10px #000;pointer-events:none;opacity:0;transform:translateY(4px);transition:opacity .12s,transform .12s}
.tip.on{opacity:1;transform:none}
.tip b{display:block;font-size:16px;font-weight:600}
.tip span{display:flex;align-items:center;gap:7px;margin-top:3px;color:var(--ink-2);font-size:12.5px}
.tip span::before{content:"";width:12px;height:2px;border-radius:1px;background:var(--tc)}
.foot{margin-top:22px;color:var(--muted);font-size:12.5px;text-align:center}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<script src="icones.js"></script>
<div class="wrap">
  <div class="hd in"><div><h1>Inventaire</h1><p>Profil Principal · mis à jour le 10 oct.</p></div>
    <button class="btn" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg><span>Importer</span></button></div>
  <div class="seg in" style="--d:.04s"><button type="button" class="on">Ressources</button><button type="button">Accélérateurs</button><button type="button">Boosts</button><button type="button">Équipement</button><button type="button">Attirail</button><button type="button">Autre</button></div>
  <div id="app"></div>
  <p class="foot">Aperçu du style avec les nombres des exemples. L’appli n’est pas modifiée.</p>
</div>
<div class="tip" id="tip" role="status" aria-live="polite"><b></b><span></span></div>
<script>
(function(){
var ic=function(id){return '<svg viewBox="0 0 64 64" aria-hidden="true"><use href="#'+id+'"/></svg>';};
var sp=function(s){return s.replace(/[  ]/g,' ');};
function num(x){var v=x>=100?Math.round(x):Math.round(x*10)/10;return sp(v.toLocaleString('fr-FR',{maximumFractionDigits:1}));}
function M(x){return num(x)+' M';}
function Q(x){return x>=1e6?M(x/1e6):x>=1e4?sp((Math.round(x/100)/10).toLocaleString('fr-FR',{maximumFractionDigits:1}))+' K':sp(x.toLocaleString('fr-FR'));}
/* exemples : en ville (M), caisses [taille, nombre] */
var RES=[
 {k:'food',n:'Nourriture',ic:'r-food',v:32,C:[[500000,18],[150000,32],[50000,44]]},
 {k:'wood',n:'Bois',ic:'r-wood',v:27,C:[[500000,16],[150000,28],[50000,36]]},
 {k:'stone',n:'Pierre',ic:'r-stone',v:12,C:[[375000,8],[112500,20],[37500,21]]},
 {k:'gold',n:'Or',ic:'r-gold',v:6.1,C:[[200000,10],[50000,19],[15000,8]]}];
RES.forEach(function(r){r.c=r.C.reduce(function(a,x){return a+x[0]*x[1];},0)/1e6;r.t=r.v+r.c;r.nb=r.C.reduce(function(a,x){return a+x[1];},0);});
var TOT=RES.reduce(function(a,r){return a+r.t;},0),VILLE=RES.reduce(function(a,r){return a+r.v;},0),CAIS=TOT-VILLE,NB=RES.reduce(function(a,r){return a+r.nb;},0);
var MAXC=Math.max.apply(null,RES.map(function(r){return Math.max.apply(null,r.C.map(function(x){return x[0]*x[1];}));}));
function cv(r){return '--c:var(--'+r.k+');--cd:color-mix(in oklab,var(--'+r.k+') 32%,var(--surface))';}
var pct=function(x){return Math.round(x/TOT*100)+' %';};
/* chaque marque porte son infobulle (valeur d'abord) et se lit aussi au clavier */
function mark(tag,cls,style,v,l,col,inner){return '<'+tag+' class="'+cls+'" tabindex="0" style="'+style+'" data-v="'+v+'" data-l="'+l+'" data-c="'+col+'" aria-label="'+l+' : '+v+'">'+(inner||'')+'</'+tag+'>';}
function total(){return '<section class="card in" style="--d:.08s"><div class="c-h"><span class="lab">Toutes tes ressources</span><button type="button" class="tbl-b" data-tb="t0" aria-pressed="false">Tableau</button></div>'+
  '<div class="hero" data-n="'+TOT+'">'+num(TOT)+'<small>M</small></div>'+
  '<div class="kpis"><div class="kpi"><b>'+M(VILLE)+'</b><span>en ville</span></div><div class="kpi"><b>'+M(CAIS)+'</b><span>en caisses</span></div><div class="kpi"><b>'+NB+'</b><span>caisses à ouvrir</span></div></div>'+
  '<div class="stack" role="img" aria-label="Part de chaque ressource">'+RES.map(function(r,k){return mark('span','s','flex:'+r.t.toFixed(2)+' 1 0;--k:'+k+';'+cv(r),M(r.t),r.n+' · '+pct(r.t),'var(--'+r.k+')','<em data-fit>'+pct(r.t)+'</em>');}).join('')+'</div>'+
  '<div class="legend">'+RES.map(function(r){return '<span><i class="sw" style="'+cv(r)+'"></i>'+r.n+' <b>'+M(r.t)+'</b></span>';}).join('')+'</div>'+
  '<table id="t0" hidden><thead><tr><th>Ressource</th><th>En ville</th><th>En caisses</th><th>Total</th><th>Part</th></tr></thead><tbody>'+
  RES.map(function(r){return '<tr><td>'+r.n+'</td><td>'+M(r.v)+'</td><td>'+M(r.c)+'</td><td>'+M(r.t)+'</td><td>'+pct(r.t)+'</td></tr>';}).join('')+'</tbody></table></section>';}
function carte(r,i){var d=(.14+i*.05).toFixed(2),dim='color-mix(in oklab,var(--'+r.k+') 32%,var(--surface))';
  return '<section class="card rc in" style="--d:'+d+'s;'+cv(r)+'"><div class="c-h"><span class="c-t">'+ic(r.ic)+r.n+'</span><button type="button" class="tbl-b" data-tb="t-'+r.k+'" aria-pressed="false">Tableau</button></div>'+
  '<div class="val">'+num(r.t)+'<small>M</small></div><div class="sub">'+pct(r.t)+' de tes ressources · '+r.nb+' caisses</div>'+
  '<div class="meter" role="img" aria-label="En ville et en caisses">'+mark('i','a','flex:'+r.v+' 1 0',M(r.v),'En ville · '+r.n,'var(--'+r.k+')')+mark('i','b','flex:'+r.c.toFixed(2)+' 1 0',M(r.c),'En caisses · '+r.n,dim)+'</div>'+
  '<div class="mk"><span><i class="sw"></i>En ville <b>'+M(r.v)+'</b></span><span><i class="sw dim"></i>En caisses <b>'+M(r.c)+'</b></span></div>'+
  '<div class="cais"><div class="lab">Caisses par taille</div>'+r.C.map(function(x,k){var val=x[0]*x[1];
    return mark('div','br','',Q(val),x[1]+' caisses de '+Q(x[0]),'var(--'+r.k+')','<span class="k">'+Q(x[0])+'<small>× '+x[1]+'</small></span><span class="t"><i style="width:'+(val/MAXC*80).toFixed(1)+'%;--k:'+k+'"></i><b>'+Q(val)+'</b></span>');}).join('')+'</div>'+
  '<table id="t-'+r.k+'" hidden><thead><tr><th>Caisse</th><th>Nombre</th><th>Valeur</th></tr></thead><tbody>'+r.C.map(function(x){return '<tr><td>'+Q(x[0])+'</td><td>'+x[1]+'</td><td>'+Q(x[0]*x[1])+'</td></tr>';}).join('')+
  '<tr><td>En ville</td><td></td><td>'+M(r.v)+'</td></tr></tbody></table></section>';}
function minis(){return '<div class="row3">'+
  '<section class="card mini gem in" style="--d:.36s"><span class="c-t">'+ic('r-gem')+'Gemmes</span><div class="val">185 430</div><div class="sub">184 930 en ville · 500 en caisses</div></section>'+
  '<section class="card mini in" style="--d:.4s"><span class="c-t">'+ic('p-chest')+'Coffres</span><div class="val">7</div><div class="sub">au choix · jusqu’à 820 K de nourriture</div></section>'+
  '<section class="card mini in" style="--d:.44s"><span class="c-t">'+ic('p-pack')+'Packs</span><div class="val">2</div><div class="sub">au hasard · ≈ 9 125 en moyenne</div></section></div>';}
document.getElementById('app').innerHTML=total()+'<div class="grid">'+RES.map(carte).join('')+'</div>'+minis();
/* étiquette dans un segment seulement si elle tient, encre claire ou foncée selon le fond */
function lum(c){var m=getComputedStyle(c).backgroundColor.match(/[\d.]+/g);if(!m)return 0;var f=function(v){v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4);};return .2126*f(+m[0])+.7152*f(+m[1])+.0722*f(+m[2]);}
function fit(){document.querySelectorAll('[data-fit]').forEach(function(e){var s=e.parentNode;e.style.visibility=e.scrollWidth+16<=s.clientWidth?'visible':'hidden';e.style.color=lum(s)>.2?'#10131a':'#fff';});}
setTimeout(fit,1150);addEventListener('resize',fit);
/* le grand chiffre compte jusqu'à sa valeur */
(function(){var e=document.querySelector('.hero[data-n]');if(!e||matchMedia('(prefers-reduced-motion: reduce)').matches)return;var n=+e.dataset.n,t0=null,u='<small>M</small>';
  function f(t){if(!t0)t0=t;var k=Math.min(1,(t-t0)/1000),v=n*(1-Math.pow(1-k,4));e.innerHTML=num(v)+u;if(k<1)requestAnimationFrame(f);}requestAnimationFrame(f);})();
/* infobulles : survol, toucher et clavier (texte inséré avec textContent) */
var tip=document.getElementById('tip');
function show(m,x,y){tip.querySelector('b').textContent=m.dataset.v;tip.querySelector('span').textContent=m.dataset.l;tip.style.setProperty('--tc',m.dataset.c);tip.classList.add('on');
  var r=tip.getBoundingClientRect(),L=Math.min(innerWidth-r.width-8,Math.max(8,x-r.width/2)),T=y-r.height-14;if(T<8)T=y+18;tip.style.left=L+'px';tip.style.top=T+'px';}
function hide(){tip.classList.remove('on');}
document.addEventListener('pointermove',function(e){var m=e.target.closest('[data-v]');if(m)show(m,e.clientX,e.clientY);else if(e.pointerType==='mouse')hide();});
document.addEventListener('pointerdown',function(e){var m=e.target.closest('[data-v]');if(m)show(m,e.clientX,e.clientY);else hide();});
document.addEventListener('focusin',function(e){var m=e.target.closest('[data-v]');if(m){var r=m.getBoundingClientRect();show(m,r.left+r.width/2,r.top);}});
document.addEventListener('focusout',hide);addEventListener('scroll',hide,{passive:true});
document.addEventListener('click',function(e){var b=e.target.closest('[data-tb]');if(!b)return;var t=document.getElementById(b.dataset.tb),on=t.hidden;t.hidden=!on;b.setAttribute('aria-pressed',String(on));});
})();
</script>
</body>
</html>
