<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Ressources validées, dataviz</title>
<!-- Page d'aperçu (2026-10-10) : l'onglet Ressources validé (v46-v47) avec les règles du skill « dataviz », à la demande de Mickaël.
     Couleurs « en ville » et « en caisses » vérifiées par scripts/validate_palette.js (mode sombre, surface #182335) :
     or #b98d2c et bleu #4b8ee6 — tout PASSE (l'or de l'appli #e3c46a est trop clair pour une barre de données : bande de clarté dépassée).
     Ce n'est pas l'appli : nombres de la version « Exemples ». -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif:wght@700&family=Roboto:wght@400;500;600;700;800&display=swap">
<style>
/* Mise en page : l'onglet validé tel quel (tuiles, rangée Gemmes · Coffres · Packs, cartes du détail), chiffres et graphiques selon dataviz. */
:root{color-scheme:dark;
  --canvas:#05070d;--card-a:#1b283b;--card-b:#152032;--surface:#182335;
  --text:#f3ead6;--ink-2:#c3cad6;--muted:#9aa5b8;--gold-2:#f3d982;--line:rgba(216,178,76,.22);--cold:rgba(154,178,211,.17);--grid:#2a3548;
  /* séries (validées) : en ville, en caisses */
  --ville:#b98d2c;--caisse:#4b8ee6;
  --display:"Noto Serif",Georgia,serif;--ui:Roboto,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box}html,body{margin:0}
body{min-height:100vh;color:var(--text);background-color:var(--canvas);background-image:radial-gradient(900px 420px at 50% -8%,rgba(216,178,76,.10),transparent 64%),linear-gradient(180deg,#08111d 0%,#05070d 100%);background-attachment:fixed;font:14px/1.4 var(--ui);-webkit-font-smoothing:antialiased}
svg{display:block;flex:none}button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
.wrap{max-width:1000px;margin:0 auto;padding:22px 16px 70px}
.frame{padding:26px;border:1px solid var(--line);border-radius:26px;background:linear-gradient(180deg,rgba(16,25,40,.92),rgba(12,19,31,.92))}
@media(max-width:600px){.frame{padding:16px;border-radius:20px}}
/* en-tête de Ma ville (repris de l'appli ; le titre reste dans la police de l'appli, ce n'est pas une donnée) */
.mv{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap}
.mv h1{margin:0;font:700 44px/1 var(--display);color:var(--gold-2)}
.mv p{margin:6px 0 0;color:var(--muted)}
.b{display:inline-flex;align-items:center;gap:8px;min-height:46px;padding:0 16px;border:1px solid var(--line);border-radius:14px;background:rgba(216,178,76,.06);color:var(--gold-2);font-weight:700}
.b svg{width:22px;height:22px}
.tabs,.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
.tabs button{flex:1 1 120px;min-height:48px;border:1px solid var(--cold);border-radius:14px;background:rgba(23,34,52,.6);color:var(--muted);font-weight:700;font-size:15px;cursor:default}
.tabs button.on{border-color:#d8b24c;background:rgba(216,178,76,.12);color:var(--gold-2)}
.chips button{min-height:44px;padding:0 15px;border:1px solid var(--cold);border-radius:22px;background:rgba(23,34,52,.6);color:var(--muted);font-weight:700;font-size:13.5px;cursor:default}
.chips button.on{border-color:#d8b24c;background:rgba(216,178,76,.12);color:var(--gold-2)}
@media(max-width:600px){.mv h1{font-size:36px}.tabs button{flex-basis:30%;font-size:14px}}

/* titre de l'onglet et chiffre principal (un seul par vue, police sans empattement, chiffres proportionnels) */
.sec-t{display:flex;align-items:flex-end;justify-content:space-between;gap:10px 24px;flex-wrap:wrap;margin:26px 0 14px}
.sec-t h2{margin:0;font:700 26px/1.1 var(--display)}
.hero{display:flex;align-items:baseline;gap:14px 26px;flex-wrap:wrap}
.hero .big{font-size:48px;font-weight:600;letter-spacing:-.02em;line-height:1}
.hero .big small{margin-left:4px;color:var(--ink-2);font-size:.42em;font-weight:500}
.hero .k{display:grid;gap:2px}.hero .k b{font-size:18px;font-weight:600}.hero .k span{color:var(--muted);font-size:12.5px}
.sec-t>small{color:var(--muted);font-size:12.5px}
@media(max-width:600px){.hero .big{font-size:44px}}

/* tuiles (comme l'appli) : chiffre en sans empattement, barre fine en deux parties */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.it{position:relative;display:grid;gap:12px;align-content:start;min-width:0;padding:18px;border:1px solid var(--cold);border-radius:20px;background:linear-gradient(135deg,var(--card-a),var(--card-b));overflow:hidden;text-align:left}
.it::before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 0 0,var(--glow,transparent),transparent 60%);pointer-events:none}
.it-h{position:relative;display:grid;grid-template-columns:56px minmax(0,1fr) auto;align-items:center;column-gap:14px}
.it-h>svg:first-child{width:56px;height:56px;filter:drop-shadow(0 4px 6px #0009)}
.it-h small{display:block;color:var(--ink-2);font-size:14px;font-weight:600}
.it-h b{display:block;margin-top:2px;font-size:36px;font-weight:600;letter-spacing:-.02em;line-height:1.05;white-space:nowrap}
.it-h b span{margin-left:3px;color:var(--ink-2);font-size:.5em;font-weight:500}
.chev{width:20px;height:20px;color:var(--muted)}
/* barre : 10 px, 2 px d'écart du fond entre les parties, bout arrondi à droite seulement, pas de hachures */
.bar{position:relative;display:flex;gap:2px;height:10px}
.bar i{position:relative;display:block;min-width:4px;outline:none;transform-origin:left;animation:grow .9s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(.15s + var(--k,0)*.06s)}
.bar i::before{content:"";position:absolute;inset:-8px 0}
.bar .v{background:var(--ville)}.bar .c{background:var(--caisse);border-radius:0 4px 4px 0}
.bar i:hover,.bar i:focus-visible{filter:brightness(1.25)}
@keyframes grow{from{transform:scaleX(0)}}
.leg{position:relative;display:flex;flex-wrap:wrap;justify-content:space-between;gap:2px 10px;color:var(--ink-2);font-size:13px}
.leg b{color:var(--text);font-weight:600}
.leg span{display:inline-flex;align-items:center;gap:6px}
.sw{width:10px;height:10px;border-radius:2px;background:var(--ville);flex:none}.sw.c{background:var(--caisse)}
@media(max-width:600px){.it{padding:14px}.it-h{grid-template-columns:40px minmax(0,1fr);column-gap:10px}.it-h>svg:first-child{width:40px;height:40px}.it-h b{font-size:28px}.chev{display:none}.leg{font-size:12px;flex-direction:column}}
.row3{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:14px;margin-top:14px}
.row3 .it-h b{font-size:30px}
.it .sub{position:relative;color:var(--muted);font-size:13px}
@media(max-width:700px){.row3{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.row3 .gem{grid-column:1/-1}}

/* détail des caisses : petits graphiques en barres, même échelle pour les 4 ressources */
.h3{margin:26px 0 10px;color:var(--muted);font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
.ic{min-width:0;padding:14px 18px 16px;border:1px solid var(--cold);border-radius:18px;background:linear-gradient(135deg,var(--card-a),var(--card-b))}
.ic-h{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.ic-h svg{width:26px;height:26px}
.ic-h b{flex:1;min-width:0;font-size:15px;font-weight:600}
@media(max-width:700px){.dgrid{grid-template-columns:minmax(0,1fr)}}
.ic-h em{font-style:normal;color:var(--ink-2);font-weight:600}
.tb{min-height:32px;padding:0 10px;border:1px solid var(--cold);border-radius:8px;background:none;color:var(--muted);font-size:12.5px;font-weight:500}
.tb[aria-pressed="true"]{color:var(--text);background:rgba(255,255,255,.06)}
.bl{display:grid;grid-template-columns:76px minmax(0,1fr);align-items:center;gap:12px;min-height:30px;border-radius:6px;outline:none}
.bl .k{color:var(--ink-2);font-size:13px;font-variant-numeric:tabular-nums}
.bl .k small{margin-left:4px;color:var(--muted)}
.bl .t{display:flex;align-items:center;gap:8px;height:30px;border-left:1px solid var(--grid)}
.bl .t i{display:block;flex:none;height:12px;border-radius:0 4px 4px 0;background:var(--caisse);transform-origin:left;animation:grow .8s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(.3s + var(--k,0)*.05s)}
.bl .t b{font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.bl .t small{white-space:nowrap}
.bl:hover .t i,.bl:focus-visible .t i{filter:brightness(1.25)}
.bl:focus-visible{box-shadow:0 0 0 2px var(--ink-2)}
.ic .stat{margin-top:4px;font-size:28px;font-weight:600;letter-spacing:-.02em}
.ic .stat small{margin-left:4px;color:var(--ink-2);font-size:.5em;font-weight:500}
.ic .note{color:var(--muted);font-size:13px}
.lst{display:grid;gap:4px}.lst span{display:flex;justify-content:space-between;color:var(--ink-2);font-size:13px}.lst b{color:var(--text);font-weight:600}
table{width:100%;margin-top:10px;border-collapse:collapse;font-size:13px}
th,td{padding:6px 2px;border-bottom:1px solid var(--grid);text-align:right;font-variant-numeric:tabular-nums}
th:first-child,td:first-child{text-align:left}th{color:var(--muted);font-weight:500}
[hidden]{display:none!important}
.tip{position:fixed;z-index:30;min-width:140px;padding:9px 12px;border:1px solid var(--cold);border-radius:10px;background:#1f2b40;box-shadow:0 12px 30px -10px #000;pointer-events:none;opacity:0;transition:opacity .12s}
.tip.on{opacity:1}.tip b{display:block;font-size:16px;font-weight:600}
.tip span{display:flex;align-items:center;gap:7px;margin-top:2px;color:var(--ink-2);font-size:12.5px}
.tip span::before{content:"";width:12px;height:2px;border-radius:1px;background:var(--tc)}
.foot{margin-top:18px;color:var(--muted);font-size:12.5px;text-align:center}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<script src="icones.js"></script>
<div class="wrap"><div class="frame">
  <div class="mv"><div><h1>Ma ville</h1><p>Profil Principal</p></div>
    <button class="b" type="button"><svg viewBox="0 0 64 64" aria-hidden="true"><use href="#n-camera"/></svg>Importer</button></div>
  <div class="tabs"><button type="button">Progression</button><button type="button" class="on">Inventaire</button><button type="button">Commandants</button><button type="button">Équipements</button><button type="button">Armements</button></div>
  <div class="chips"><button type="button" class="on">Ressources</button><button type="button">Accélérateurs</button><button type="button">Boosts</button><button type="button">Équipement</button><button type="button">Attirail</button><button type="button">Autre</button></div>
  <div id="app"></div>
</div>
<p class="foot">Aperçu de l’onglet validé avec les règles dataviz, nombres des exemples. L’appli n’est pas modifiée.</p></div>
<div class="tip" id="tip" role="status" aria-live="polite"><b></b><span></span></div>
<script>
(function(){
var ic=function(id){return '<svg viewBox="0 0 64 64" aria-hidden="true"><use href="#'+id+'"/></svg>';};
var CH='<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg>';
var sp=function(s){return s.replace(/[  ]/g,' ');};
function num(x){var v=x>=100?Math.round(x):Math.round(x*10)/10;return sp(v.toLocaleString('fr-FR',{maximumFractionDigits:1}));}
function M(x){return num(x)+' M';}
function Q(x){return x>=1e6?M(x/1e6):x>=1e5?sp(Math.round(x/1e3).toLocaleString('fr-FR'))+' K':x>=1e4?sp((Math.round(x/100)/10).toLocaleString('fr-FR'))+' K':sp(x.toLocaleString('fr-FR'));}
function nb(x){return sp(x.toLocaleString('fr-FR'));}
var RES=[
 {k:'food',n:'Nourriture',ic:'r-food',v:32,glow:'#d8b24c33',C:[[500000,18],[150000,32],[50000,44]]},
 {k:'wood',n:'Bois',ic:'r-wood',v:27,glow:'#c27a4a33',C:[[500000,16],[150000,28],[50000,36]]},
 {k:'stone',n:'Pierre',ic:'r-stone',v:12,glow:'#a9bdd52e',C:[[375000,8],[112500,20],[37500,21]]},
 {k:'gold',n:'Or',ic:'r-gold',v:6.1,glow:'#f3d98233',C:[[200000,10],[50000,19],[15000,8]]}];
RES.forEach(function(r){r.c=r.C.reduce(function(a,x){return a+x[0]*x[1];},0)/1e6;r.t=r.v+r.c;});
var TOT=RES.reduce(function(a,r){return a+r.t;},0),VILLE=RES.reduce(function(a,r){return a+r.v;},0),CAIS=TOT-VILLE;
var MAX=Math.max.apply(null,RES.map(function(r){return Math.max.apply(null,r.C.map(function(x){return x[0]*x[1];}));}));
/* une marque = son infobulle (valeur d'abord), lisible au clavier */
function tipA(v,l,c){return ' tabindex="0" data-v="'+v+'" data-l="'+l+'" data-c="'+c+'" aria-label="'+l+' : '+v+'"';}
function big(s){return s.replace(/ (M|K)$/,'<span>$1</span>');}
function tuile(o,i){return '<button type="button" class="it'+(o.cls||'')+'" style="--glow:'+(o.glow||'transparent')+'"><span class="it-h">'+ic(o.ic)+'<span><small>'+o.n+'</small><b>'+o.val+'</b></span>'+CH+'</span>'+
  (o.v!=null?'<span class="bar"><i class="v" style="flex:'+o.v+' 1 0;--k:'+i+'"'+tipA(o.lv,'En ville · '+o.n,'var(--ville)')+'></i><i class="c" style="flex:'+o.c+' 1 0;--k:'+i+'"'+tipA(o.lc,'En caisses · '+o.n,'var(--caisse)')+'></i></span>'+
    '<span class="leg"><span><i class="sw"></i>En ville <b>'+o.lv+'</b></span><span><i class="sw c"></i>En caisses <b>'+o.lc+'</b></span></span>':'<span class="sub">'+o.sub+'</span>')+'</button>';}
var h='<div class="sec-t"><h2>Ressources</h2><div class="hero"><div class="big">'+num(TOT)+'<small>M au total</small></div><div class="k"><b>'+M(VILLE)+'</b><span>en ville</span></div><div class="k"><b>'+M(CAIS)+'</b><span>en caisses</span></div></div><small>Import du 2 oct.</small></div>';
h+='<div class="grid">'+RES.map(function(r,i){return tuile({n:r.n,ic:r.ic,glow:r.glow,val:big(M(r.t)),v:r.v,c:r.c.toFixed(2),lv:M(r.v),lc:M(r.c)},i);}).join('')+'</div>';
h+='<div class="row3">'+tuile({cls:' gem',n:'Gemmes',ic:'r-gem',glow:'#ef6a7a2e',val:'185 430',v:184930,c:500,lv:'184 930',lc:'500'},4)+
  tuile({n:'Coffres',ic:'p-chest',glow:'#d8b24c22',val:'7',sub:'Au choix · jusqu’à 820 K de nourriture'})+tuile({n:'Packs',ic:'p-pack',glow:'#c27a4a22',val:'2',sub:'Au hasard · ≈ 9 125 en moyenne'})+'</div>';
var k=0;
h+='<h3 class="h3">Détail des caisses · barres à la même échelle</h3><div class="grid dgrid">'+RES.map(function(r){
  return '<section class="ic"><div class="ic-h">'+ic(r.ic)+'<b>'+r.n+' · caisses</b><em>'+M(r.c)+'</em><button type="button" class="tb" data-tb="t-'+r.k+'" aria-pressed="false">Tableau</button></div>'+
  r.C.map(function(x){var val=x[0]*x[1];return '<div class="bl"'+tipA(Q(val),x[1]+' caisses de '+nb(x[0]),'var(--caisse)')+'><span class="k">'+nb(x[0])+'</span><span class="t"><i style="width:'+(val/MAX*66).toFixed(1)+'%;--k:'+(k++)+'"></i><b>'+Q(val)+'</b><small style="color:var(--muted)">× '+x[1]+'</small></span></div>';}).join('')+
  '<table id="t-'+r.k+'" hidden><thead><tr><th>Caisse</th><th>Nombre</th><th>Valeur</th></tr></thead><tbody>'+r.C.map(function(x){return '<tr><td>'+nb(x[0])+'</td><td>'+x[1]+'</td><td>'+Q(x[0]*x[1])+'</td></tr>';}).join('')+'</tbody></table></section>';}).join('')+
  /* une seule barre n'est pas un graphique : les gemmes en caisses deviennent un chiffre */
  '<section class="ic"><div class="ic-h">'+ic('r-gem')+'<b>Gemmes · caisses</b></div><div class="stat">500<small>gemmes</small></div><div class="note">50 caisses de 10</div></section>'+
  '<section class="ic"><div class="ic-h">'+ic('p-chest')+'<b>Coffres « Choisissez un »</b><em>7</em><button type="button" class="tb" data-tb="t-cof" aria-pressed="false">Tableau</button></div>'+
  [['Niveau 1',2],['Niveau 2',3],['Niveau 3',1],['Niveau 4',1]].map(function(x,j){return '<div class="bl"'+tipA('× '+x[1],'Coffres '+x[0].toLowerCase(),'var(--caisse)')+'><span class="k">'+x[0]+'</span><span class="t"><i style="width:'+(x[1]/3*66).toFixed(1)+'%;--k:'+(k++)+'"></i><b>× '+x[1]+'</b></span></div>';}).join('')+
  '<table id="t-cof" hidden><thead><tr><th>Coffre</th><th>Nombre</th></tr></thead><tbody><tr><td>Niveau 1</td><td>2</td></tr><tr><td>Niveau 2</td><td>3</td></tr><tr><td>Niveau 3</td><td>1</td></tr><tr><td>Niveau 4</td><td>1</td></tr></tbody></table></section>'+
  '<section class="ic"><div class="ic-h">'+ic('p-pack')+'<b>Packs de ressources</b><em>2</em></div><div class="lst"><span>Pack A niveau 1 <b>× 1</b></span><span>Pack niveau 2 <b>× 1</b></span></div></section>'+
  '</div>';
document.getElementById('app').innerHTML=h;
var tip=document.getElementById('tip');
function show(m,x,y){tip.querySelector('b').textContent=m.dataset.v;tip.querySelector('span').textContent=m.dataset.l;tip.style.setProperty('--tc',m.dataset.c);tip.classList.add('on');
  var r=tip.getBoundingClientRect(),L=Math.min(innerWidth-r.width-8,Math.max(8,x-r.width/2)),T=y-r.height-14;if(T<8)T=y+18;tip.style.left=L+'px';tip.style.top=T+'px';}
function hide(){tip.classList.remove('on');}
document.addEventListener('pointermove',function(e){var m=e.target.closest('[data-v]');if(m)show(m,e.clientX,e.clientY);else if(e.pointerType==='mouse')hide();});
document.addEventListener('pointerdown',function(e){var m=e.target.closest('[data-v]');if(m)show(m,e.clientX,e.clientY);else hide();});
document.addEventListener('focusin',function(e){var m=e.target.closest('[data-v]');if(m){var r=m.getBoundingClientRect();show(m,r.left+r.width/2,r.top);}});
document.addEventListener('focusout',hide);addEventListener('scroll',hide,{passive:true});
document.addEventListener('click',function(e){var b=e.target.closest('[data-tb]');if(!b)return;e.stopPropagation();var t=document.getElementById(b.dataset.tb),on=t.hidden;t.hidden=!on;b.setAttribute('aria-pressed',String(on));});
})();
</script>
</body>
</html>
