<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Ressources revues</title>
<!-- Page d'aperçu (2026-10-10) : l'onglet Ressources validé (v46-v47, mélange A + C) retravaillé avec les principes du skill « artifact-design »,
     à la demande de Mickaël (« Pars du visuel déjà validé sur le site pour l'onglet Ressources »). Mêmes polices, couleurs et tuiles que l'appli ;
     ce qui change : résumé avant le détail, cadres réservés aux 4 ressources, barres du détail à une même échelle, ressources exposées au pillage.
     Ce n'est pas l'appli : nombres de la version « Exemples » (réserve niveau 22). -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif:wght@700&family=Roboto:wght@400;500;700;800&display=swap">
<style>
/* Mise en page : le coffre du gouverneur — un résumé en tête, 4 ressources en objets (cartes), le reste en panneaux plats avec filets. */
:root{color-scheme:dark;
  /* couleurs (celles de l'appli) */
  --canvas:#05070d;--surface:#101928;--card-a:#1b283b;--card-b:#152032;--panel:#111a29;
  --text:#f3ead6;--muted:#b1bbca;--faint:#8792a6;--gold:#d8b24c;--gold-2:#f3d982;--line:rgba(216,178,76,.22);--cold:rgba(154,178,211,.17);--hair:rgba(154,178,211,.12);
  --ville:#e3c46a;--caisse:#5b8fd6;--alerte:#ef8a74;
  /* polices (celles de l'appli) : titre et grands nombres en serif, le reste en Roboto */
  --display:"Noto Serif",Georgia,"Times New Roman",serif;--body:Roboto,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box}html,body{margin:0}
body{min-height:100vh;color:var(--text);background-color:var(--canvas);background-image:radial-gradient(900px 420px at 50% -8%,rgba(216,178,76,.10),transparent 64%),linear-gradient(180deg,#08111d 0%,#05070d 100%);background-attachment:fixed;font:14px/1.4 var(--body);-webkit-font-smoothing:antialiased}
svg{display:block;flex:none}button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
.wrap{max-width:1000px;margin:0 auto;padding:22px 16px 70px}
.frame{padding:26px;border:1px solid var(--line);border-radius:26px;background:linear-gradient(180deg,rgba(16,25,40,.92),rgba(12,19,31,.92))}
@media(max-width:600px){.frame{padding:16px;border-radius:20px}}

/* en-tête de Ma ville (repris de l'appli) */
.mv{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap}
.mv h1{margin:0;font:700 44px/1 var(--display);color:var(--gold-2)}
.mv p{margin:6px 0 0;color:var(--muted)}
.b{display:inline-flex;align-items:center;gap:8px;min-height:46px;padding:0 16px;border:1px solid var(--line);border-radius:14px;background:rgba(216,178,76,.06);color:var(--gold-2);font-weight:700}
.b svg{width:22px;height:22px}
.tabs,.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
.tabs button{flex:1 1 120px;min-height:48px;border:1px solid var(--cold);border-radius:14px;background:rgba(23,34,52,.6);color:var(--muted);font-weight:700;font-size:15px;cursor:default}
.tabs button.on{border-color:var(--gold);background:rgba(216,178,76,.12);color:var(--gold-2)}
.chips button{min-height:44px;padding:0 15px;border:1px solid var(--cold);border-radius:22px;background:rgba(23,34,52,.6);color:var(--muted);font-weight:700;font-size:13.5px;cursor:default}
.chips button.on{border-color:var(--gold);background:rgba(216,178,76,.12);color:var(--gold-2)}
@media(max-width:600px){.mv h1{font-size:36px}.tabs button{flex-basis:30%;font-size:14px}}

/* résumé avant le détail */
.sum{display:flex;align-items:flex-end;justify-content:space-between;gap:10px 24px;flex-wrap:wrap;margin:26px 0 14px}
.sum h2{margin:0;font:700 26px/1.1 var(--display);text-wrap:balance}
.sum dl{display:flex;gap:6px 26px;flex-wrap:wrap;margin:0}
.sum dl div{display:grid;gap:2px}
.sum dt{color:var(--faint);font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.sum dd{margin:0;font:700 20px/1.1 var(--display)}
.sum small{color:var(--faint);font-size:12.5px}

/* les 4 ressources : seules à avoir un cadre (ce sont les objets de la page) */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.rc{position:relative;display:grid;gap:14px;align-content:start;min-width:0;padding:18px;border:1px solid var(--cold);border-radius:20px;background:linear-gradient(135deg,var(--card-a),var(--card-b));overflow:hidden;text-align:left;
  transition:transform .3s cubic-bezier(.2,.8,.2,1),border-color .3s}
.rc::before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 0 0,var(--glow),transparent 60%);pointer-events:none}
.rc:hover,.rc:focus-visible{transform:translateY(-2px);border-color:rgba(243,217,130,.35);outline:none}
.rc-h{position:relative;display:grid;grid-template-columns:56px minmax(0,1fr) auto;align-items:center;column-gap:14px}
.rc-h>svg:first-child{width:56px;height:56px;filter:drop-shadow(0 4px 6px #0009)}
.rc-h small{display:block;color:var(--muted);font-size:13px;font-weight:800;letter-spacing:.06em;text-transform:uppercase}
.rc-h b{display:block;margin-top:2px;font:700 38px/1.05 var(--display);white-space:nowrap}
.rc-h b span{font-size:.6em}
.chev{width:20px;height:20px;color:var(--faint)}
.bar{position:relative;display:flex;gap:2px;height:10px;border-radius:6px;overflow:hidden;background:#0b1220}
.bar i{display:block;height:100%;transform-origin:left;animation:fill .9s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(.15s + var(--k,0)*.07s)}
.bar .v{background:linear-gradient(90deg,#c8a44f,#f3d982)}
.bar .c{background:repeating-linear-gradient(135deg,#5b8fd6 0 6px,#4a7cc0 6px 12px)}
@keyframes fill{from{transform:scaleX(0)}}
.leg{display:flex;flex-wrap:wrap;justify-content:space-between;gap:2px 10px;color:var(--muted);font-size:13px}
.leg b{color:var(--text)}
.leg span::before{content:"";display:inline-block;width:8px;height:8px;margin-right:6px;border-radius:2px;background:var(--ville)}
.leg .c::before{background:var(--caisse)}
/* un détail propre au jeu : ce qui dépasse la protection de la réserve peut être pillé */
.pil{display:flex;align-items:center;gap:8px;min-height:32px;padding:6px 10px;border-radius:10px;background:rgba(239,138,116,.09);box-shadow:inset 0 0 0 1px rgba(239,138,116,.25);color:var(--muted);font-size:12.5px}
.pil svg{width:16px;height:16px;color:var(--alerte)}
.pil b{color:var(--alerte);font-weight:700}
.pil .ct{display:none}
@media(max-width:600px){.rc{padding:14px;gap:12px}.rc-h{grid-template-columns:40px minmax(0,1fr);column-gap:10px}.rc-h>svg:first-child{width:40px;height:40px}.rc-h b{font-size:28px}.chev{display:none}.pil .pr,.pil .lg{display:none}.pil .ct{display:inline}.leg{font-size:12px}}

/* gemmes, coffres, packs : un panneau plat en trois colonnes, séparées par des filets */
.trio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));margin-top:14px;border:1px solid var(--hair);border-radius:18px;background:var(--panel)}
.trio>div{display:grid;gap:4px;padding:16px 18px;border-left:1px solid var(--hair)}
.trio>div:first-child{border-left:0}
.trio .h{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase}
.trio .h svg{width:26px;height:26px}
.trio b{font:700 28px/1.1 var(--display)}
.trio span{color:var(--faint);font-size:12.5px}
@media(max-width:600px){.trio{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.trio>div:first-child{grid-column:1/-1;border-bottom:1px solid var(--hair)}.trio>div:nth-child(2){border-left:0}}

/* détail des caisses : un seul panneau, une même échelle pour toutes les barres */
.det{margin-top:26px}
.det-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.det-h h3{margin:0;color:var(--muted);font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase}
.det-h small{color:var(--faint);font-size:12.5px}
.ledger{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));border:1px solid var(--hair);border-radius:18px;background:var(--panel)}
.sec{display:grid;align-content:start;gap:2px;padding:14px 18px 16px;border-top:1px solid var(--hair)}
.sec:nth-child(-n+2){border-top:0}.sec:nth-child(even){border-left:1px solid var(--hair)}
.sec-h{display:flex;align-items:center;gap:9px;margin-bottom:6px;font-weight:700;font-size:14.5px}
.sec-h svg{width:24px;height:24px}
.sec-h em{margin-left:auto;font:700 16px/1 var(--display);font-style:normal;color:var(--text)}
.ln{display:grid;grid-template-columns:72px minmax(0,1fr) 54px 44px;align-items:center;gap:10px;min-height:28px;font-variant-numeric:tabular-nums}
.ln>span:first-child{color:var(--muted);font-size:13px}
.ln .t{height:6px;border-radius:3px;background:#0b1220}
.ln .t i{display:block;height:100%;border-radius:0 3px 3px 0;background:linear-gradient(90deg,#4a7cc0,#7fb0f0);transform-origin:left;animation:fill .9s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(.35s + var(--k,0)*.05s)}
.ln b{text-align:right;font-size:13.5px}
.ln small{text-align:right;color:var(--faint);font-size:12.5px}
.sec.small .ln{grid-template-columns:minmax(0,1fr) auto}
.sec.small .ln b{font-weight:500;color:var(--muted)}
@media(max-width:700px){.ledger{grid-template-columns:minmax(0,1fr)}.sec:nth-child(2){border-top:1px solid var(--hair)}.sec:nth-child(even){border-left:0}}
.note{margin-top:14px;color:var(--faint);font-size:12.5px}
.foot{margin-top:18px;color:var(--faint);font-size:12.5px;text-align:center}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<script src="icones.js"></script>
<div class="wrap"><div class="frame">
  <div class="mv"><div><h1>Ma ville</h1><p>Profil Principal</p></div>
    <button class="b" type="button"><svg viewBox="0 0 64 64" aria-hidden="true"><use href="#n-camera"/></svg>Importer</button></div>
  <div class="tabs"><button type="button">Progression</button><button type="button" class="on">Inventaire</button><button type="button">Commandants</button><button type="button">Équipements</button><button type="button">Armements</button></div>
  <div class="chips"><button type="button" class="on">Ressources</button><button type="button">Accélérateurs</button><button type="button">Boosts</button><button type="button">Équipement</button><button type="button">Attirail</button><button type="button">Autre</button></div>
  <div id="app"></div>
</div>
<p class="foot">Aperçu à partir de l’onglet validé, avec les nombres des exemples. L’appli n’est pas modifiée.</p></div>
<script>
(function(){
var ic=function(id){return '<svg viewBox="0 0 64 64" aria-hidden="true"><use href="#'+id+'"/></svg>';};
var CH='<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg>';
var WARN='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l9 16H3z"/><path d="M12 10v4M12 17h.01"/></svg>';
var sp=function(s){return s.replace(/[  ]/g,' ');};
function M(x){var v=x>=100?Math.round(x):Math.round(x*10)/10;return sp(v.toLocaleString('fr-FR',{maximumFractionDigits:1}))+' M';}
function Q(x){return x>=1e6?M(x/1e6):x>=1e5?sp(Math.round(x/1e3).toLocaleString('fr-FR'))+' K':x>=1e4?sp((Math.round(x/100)/10).toLocaleString('fr-FR'))+' K':sp(x.toLocaleString('fr-FR'));}
function nb(x){return sp(x.toLocaleString('fr-FR'));}
/* exemples : en ville (M), caisses [taille, nombre], protection de la réserve niv. 22 (M) */
var RES=[
 {k:'food',n:'Nourriture',ic:'r-food',v:32,pr:1.4,glow:'#d8b24c33',C:[[500000,18],[150000,32],[50000,44]]},
 {k:'wood',n:'Bois',ic:'r-wood',v:27,pr:1.4,glow:'#c27a4a33',C:[[500000,16],[150000,28],[50000,36]]},
 {k:'stone',n:'Pierre',ic:'r-stone',v:12,pr:1.05,glow:'#a9bdd52e',C:[[375000,8],[112500,20],[37500,21]]},
 {k:'gold',n:'Or',ic:'r-gold',v:6.1,pr:.5,glow:'#f3d98233',C:[[200000,10],[50000,19],[15000,8]]}];
RES.forEach(function(r){r.c=r.C.reduce(function(a,x){return a+x[0]*x[1];},0)/1e6;r.t=r.v+r.c;r.nb=r.C.reduce(function(a,x){return a+x[1];},0);r.ex=Math.max(0,r.v-r.pr);});
var TOT=RES.reduce(function(a,r){return a+r.t;},0),VILLE=RES.reduce(function(a,r){return a+r.v;},0),CAIS=TOT-VILLE,NBC=RES.reduce(function(a,r){return a+r.nb;},0);
var MAX=Math.max.apply(null,RES.map(function(r){return Math.max.apply(null,r.C.map(function(x){return x[0]*x[1];}));}));
function big(x){var s=M(x);return s.replace(' M','<span> M</span>');}
var h='<div class="sum"><h2>Ressources</h2><dl><div><dt>Au total</dt><dd>'+M(TOT)+'</dd></div><div><dt>En ville</dt><dd>'+M(VILLE)+'</dd></div><div><dt>En caisses</dt><dd>'+M(CAIS)+'</dd></div></dl><small>Import du 2 oct.</small></div>';
h+='<div class="grid">'+RES.map(function(r,i){return '<button type="button" class="rc" style="--glow:'+r.glow+'">'+
  '<span class="rc-h">'+ic(r.ic)+'<span><small>'+r.n+'</small><b>'+big(r.t)+'</b></span>'+CH+'</span>'+
  '<span class="bar"><i class="v" style="flex:'+r.v+' 1 0;--k:'+i+'"></i><i class="c" style="flex:'+r.c.toFixed(2)+' 1 0;--k:'+i+'"></i></span>'+
  '<span class="leg"><span class="v">En ville <b>'+M(r.v)+'</b></span><span class="c">En caisses <b>'+M(r.c)+'</b></span></span>'+
  (r.ex>0?'<span class="pil">'+WARN+'<span><b>'+M(r.ex)+'</b> <span class="lg">exposés au pillage</span><span class="ct">pillables</span><span class="pr"> · la réserve en protège '+M(r.pr)+'</span></span></span>':'')+'</button>';}).join('')+'</div>';
h+='<div class="trio"><div><span class="h">'+ic('r-gem')+'Gemmes</span><b>185 430</b><span>184 930 en ville · 500 en caisses</span></div>'+
  '<div><span class="h">'+ic('p-chest')+'Coffres</span><b>7</b><span>au choix · jusqu’à 820 K de nourriture</span></div>'+
  '<div><span class="h">'+ic('p-pack')+'Packs</span><b>2</b><span>au hasard · ≈ 9 125 en moyenne</span></div></div>';
var k=0;
h+='<div class="det"><div class="det-h"><h3>Détail des caisses</h3><small>'+NBC+' caisses · '+M(CAIS)+' · barres à la même échelle</small></div><div class="ledger">'+
  RES.map(function(r){return '<div class="sec"><div class="sec-h">'+ic(r.ic)+r.n+'<em>'+M(r.c)+'</em></div>'+
    r.C.map(function(x){var val=x[0]*x[1];return '<div class="ln"><span>'+nb(x[0])+'</span><span class="t"><i style="width:'+(val/MAX*100).toFixed(1)+'%;--k:'+(k++)+'"></i></span><b>'+Q(val)+'</b><small>× '+x[1]+'</small></div>';}).join('')+'</div>';}).join('')+
  '<div class="sec small"><div class="sec-h">'+ic('p-chest')+'Coffres « Choisissez un »<em>7</em></div>'+[['Niveau 1',2],['Niveau 2',3],['Niveau 3',1],['Niveau 4',1]].map(function(x){return '<div class="ln"><span>'+x[0]+'</span><b>× '+x[1]+'</b></div>';}).join('')+'</div>'+
  '<div class="sec small"><div class="sec-h">'+ic('r-gem')+'Gemmes et packs<em></em></div><div class="ln"><span>Caisses de 10 gemmes</span><b>× 50</b></div><div class="ln"><span>Pack niveau 1</span><b>× 1</b></div><div class="ln"><span>Pack niveau 2</span><b>× 1</b></div></div>'+
  '</div><p class="note">Pillage : ce qui dépasse la protection de ta réserve (niveau 22) peut être pris lors d’une attaque. Les caisses ne peuvent pas être pillées.</p></div>';
document.getElementById('app').innerHTML=h;
})();
</script>
</body>
</html>
