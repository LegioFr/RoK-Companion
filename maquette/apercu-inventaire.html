<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Inventaire repensé</title>
<!-- Page d'aperçu (2026-10-10) : Inventaire repensé après les réponses de Mickaël (trop chargé, pas assez utile, pas de grille de tuiles,
     garder sombre et or ; il veut voir combien il a, savoir s'il a assez, savoir quoi en faire). Deux organisations à comparer.
     Ce n'est pas l'appli : nombres de la version « Exemples » (HDV 24, VIP 17, réserve 22). À supprimer une fois le choix intégré. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif:wght@700&family=Roboto:wght@400;500;600;700;800&display=swap">
<style>
:root{color-scheme:dark;
  --text:#f3ead6;--muted:#b1bbca;--faint:#8590a4;--gold:#d8b24c;--gold-2:#f3d982;--line:rgba(154,178,211,.13);--line-g:rgba(243,217,130,.18);
  --ok:#5fd59b;--ko:#f0a35e;--info:#8db6f2;
  --display:"Noto Serif",Georgia,serif;--body:Roboto,system-ui,-apple-system,"Segoe UI",sans-serif;
  --o1:#ffe0a0;--o2:#ee9324;--p1:#dcb8ff;--p2:#9356ea;--b1:#a6d6ff;--b2:#3584e4;--v1:#a6efb0;--v2:#33a94e;--g1:#e2e7ee;--g2:#7d8899}
*{box-sizing:border-box}html,body{margin:0}
body{min-height:100vh;color:var(--text);background:#05070d;font:14px/1.4 var(--body);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(1000px 480px at 50% -10%,rgba(216,178,76,.12),transparent 62%),linear-gradient(180deg,#08111d,#05070d)}
svg{display:block;flex:none}button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
.wrap{max-width:1060px;margin:0 auto;padding:20px 16px 80px}

/* ---------- en-tête de l'aperçu ---------- */
.ap-t{margin:0 0 6px;font:700 28px/1.15 var(--display);color:var(--gold-2)}
.ap-p{margin:0 0 14px;color:var(--muted);max-width:700px}
.opt{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:26px}
.opt button{display:grid;gap:2px;min-height:56px;padding:9px 16px;border:1px solid rgba(154,178,211,.22);border-radius:14px;background:#0d1626;text-align:left}
.opt button b{font-size:15px}.opt button small{color:var(--muted);font-size:12.5px}
.opt button[aria-pressed="true"]{border-color:rgba(243,217,130,.7);background:linear-gradient(180deg,rgba(216,178,76,.18),rgba(216,178,76,.05))}
.opt button[aria-pressed="true"] b{color:var(--gold-2)}

/* ---------- écran ---------- */
.scr-h{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:14px}
.scr-h h1{margin:0;font:700 34px/1 var(--display);color:var(--gold-2)}
.scr-h small{color:var(--faint);font-size:12.5px}
@media(max-width:480px){.scr-h{flex-direction:column;align-items:flex-start;gap:6px}}
.lay{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:22px;align-items:start}
.side{position:sticky;top:16px;display:grid;gap:14px}
@media(max-width:820px){.lay{grid-template-columns:minmax(0,1fr)}.side{position:static;order:-1}}

/* onglets du jeu */
.tabs{display:flex;gap:6px;overflow-x:auto;margin:0 -16px 16px;padding:0 16px 2px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;min-height:42px;padding:0 15px;border:1px solid var(--line);border-radius:999px;background:rgba(16,25,40,.7);color:var(--muted);font-weight:600}
.tabs button[aria-pressed="true"]{border-color:rgba(243,217,130,.6);color:var(--gold-2);background:linear-gradient(180deg,rgba(216,178,76,.16),rgba(216,178,76,.04))}

/* carte objectif */
.goal{position:relative;overflow:hidden;padding:18px;border:1px solid transparent;border-radius:20px;
  background:radial-gradient(400px 200px at 100% 0%,rgba(216,178,76,.16),transparent 70%) padding-box,linear-gradient(160deg,#1f2d44,#131d2f) padding-box,linear-gradient(165deg,rgba(243,217,130,.55),rgba(154,178,211,.08) 45%,rgba(243,217,130,.2)) border-box;
  box-shadow:0 18px 36px -20px #000}
.goal .k{color:#ecd393;font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase}
.goal h2{margin:4px 0 14px;font:700 24px/1.15 var(--display)}
.gl{display:grid;gap:12px}
.gi{display:grid;grid-template-columns:minmax(0,1fr) auto;row-gap:6px;column-gap:10px;align-items:baseline}
.gi span{color:var(--muted);font-size:13.5px}.gi b{font-size:14px;font-variant-numeric:tabular-nums}
.gi .tr{grid-column:1/-1}
.tr{position:relative;height:4px;border-radius:2px;background:rgba(255,255,255,.06)}
.tr i{position:absolute;inset:0 auto 0 0;border-radius:2px;background:linear-gradient(90deg,rgba(216,160,50,.55),#f3d982);box-shadow:0 0 10px rgba(238,170,60,.6)}
.tr i::after{content:"";position:absolute;right:-4px;top:50%;width:9px;height:9px;margin-top:-4.5px;border-radius:50%;background:radial-gradient(circle,#fff,#f3d982 40%,transparent 72%)}
.tr.ok i{background:linear-gradient(90deg,rgba(60,190,130,.5),#8ff0c0);box-shadow:0 0 10px rgba(95,213,155,.6)}
.tr.ok i::after{background:radial-gradient(circle,#fff,#8ff0c0 40%,transparent 72%)}
.gi b.ok{color:var(--ok)}.gi b.ko{color:var(--ko)}
.goal .lk{display:inline-flex;align-items:center;gap:6px;margin-top:14px;color:var(--gold-2);font-size:13.5px;font-weight:600;text-decoration:none}

/* à retenir */
.mem{padding:16px 18px;border:1px solid var(--line);border-radius:20px;background:linear-gradient(180deg,rgba(23,34,52,.85),rgba(16,25,40,.85))}
.mem h3{margin:0 0 10px;color:#ecd393;font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase}
.ins{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.ins:first-of-type{border-top:0;padding-top:2px}
.ins .d{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;font-size:14px;font-weight:800}
.ins.ok .d{color:var(--ok);background:rgba(95,213,155,.12);box-shadow:inset 0 0 0 1px rgba(95,213,155,.35)}
.ins.ko .d{color:var(--ko);background:rgba(240,163,94,.12);box-shadow:inset 0 0 0 1px rgba(240,163,94,.35)}
.ins.info .d{color:var(--gold-2);background:rgba(216,178,76,.12);box-shadow:inset 0 0 0 1px rgba(216,178,76,.35)}
.ins p{margin:3px 0 0;color:var(--muted);font-size:13.5px;line-height:1.45}
.ins p b{color:var(--text);font-weight:600}

/* liste */
.grp{margin-bottom:18px}
.grp h3{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:0 0 8px;padding:0 4px;color:#ecd393;font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase}
.grp h3 small{color:var(--faint);font-size:12px;font-weight:500;letter-spacing:0;text-transform:none}
.list{border:1px solid var(--line);border-radius:18px;background:linear-gradient(180deg,rgba(25,37,57,.9),rgba(17,26,42,.9));overflow:hidden;box-shadow:0 14px 30px -20px #000}
.row{position:relative;display:grid;grid-template-columns:40px minmax(0,1fr) auto 16px;align-items:center;column-gap:12px;width:100%;min-height:64px;padding:11px 14px;border:0;border-top:1px solid var(--line);background:none;text-align:left;transition:background .2s}
.row:first-child{border-top:0}
.row:hover,.row:focus-visible{background:rgba(216,178,76,.06);outline:none}
.row .ri{display:grid;place-items:center;width:40px;height:40px;border-radius:12px;background:radial-gradient(circle at 35% 28%,#2b3d5c,#111a2b 70%);box-shadow:inset 0 0 0 1px rgba(243,217,130,.2)}
.row .ri svg{width:28px;height:28px;filter:drop-shadow(0 2px 3px #000a)}
.row .rt{min-width:0}
.row .rt b{display:block;font-size:15px;font-weight:600}
.row .rt small{display:block;margin-top:2px;color:var(--muted);font-size:13px;line-height:1.35}
.row .rv{display:grid;justify-items:end;gap:3px;text-align:right}
.row .rv b{font:700 20px/1.05 var(--display);color:var(--gold-2);white-space:nowrap;font-variant-numeric:tabular-nums}
.row .rv small{font-size:12.5px;font-weight:600;white-space:nowrap}
.row .rv small.ok{color:var(--ok)}.row .rv small.ko{color:var(--ko)}.row .rv small.n{color:var(--faint);font-weight:500}
.row .ch{color:var(--faint)}.row .ch svg{width:16px;height:16px}
.row .tr{grid-column:2/4;margin-top:8px}
.row.vide .rv b{color:var(--faint);font-size:16px;font-family:var(--body);font-weight:600}
.dots{display:inline-flex;align-items:center;gap:3px;margin-right:4px;vertical-align:1px}
.dots i{width:8px;height:8px;border-radius:50%;background:radial-gradient(circle at 35% 30%,var(--c1),var(--c2))}
.q-o{--c1:var(--o1);--c2:var(--o2)}.q-p{--c1:var(--p1);--c2:var(--p2)}.q-b{--c1:var(--b1);--c2:var(--b2)}.q-v{--c1:var(--v1);--c2:var(--v2)}.q-g{--c1:var(--g1);--c2:var(--g2)}
@media(max-width:480px){.row{grid-template-columns:36px minmax(0,1fr) auto;column-gap:10px;padding:11px 12px}.row .ri{width:36px;height:36px}.row .ch{display:none}.row .rv b{font-size:18px}.row .tr{grid-column:2/4}}

/* fenêtre du détail */
.sheet{position:fixed;inset:0;z-index:50;display:grid;align-items:end;justify-items:center;background:rgba(2,4,8,.6);backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .25s}
.sheet.on{opacity:1;pointer-events:auto}
.sh{width:min(560px,100%);max-height:86vh;overflow:auto;padding:20px 20px 26px;border:1px solid var(--line-g);border-bottom:0;border-radius:24px 24px 0 0;background:linear-gradient(180deg,#1b283d,#111a2a);transform:translateY(30px);transition:transform .3s cubic-bezier(.2,.8,.2,1)}
.sheet.on .sh{transform:none}
@media(min-width:821px){.sheet{align-items:center}.sh{border-radius:24px;border-bottom:1px solid var(--line-g)}}
.sh-h{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;align-items:center;margin-bottom:6px}
.sh-h .ri{display:grid;place-items:center;width:44px;height:44px;border-radius:13px;background:radial-gradient(circle at 35% 28%,#2b3d5c,#111a2b 70%);box-shadow:inset 0 0 0 1px rgba(243,217,130,.25)}
.sh-h .ri svg{width:30px;height:30px}
.sh-h h2{margin:0;font:700 22px/1.15 var(--display)}
.sh-h button{width:40px;height:40px;border:0;border-radius:50%;background:rgba(255,255,255,.05);color:var(--muted);font-size:20px}
.sh-big{margin:12px 0 4px;font:700 40px/1 var(--display);color:var(--gold-2)}
.sh-sub{margin:0 0 14px;color:var(--muted)}
.sh-l{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding:10px 0;border-top:1px solid var(--line);align-items:center}
.sh-l span{color:var(--muted)}.sh-l b{font-variant-numeric:tabular-nums}
.sh-l .tr{grid-column:1/-1;margin-top:4px}
.sh .btn{display:block;width:100%;min-height:48px;margin-top:16px;border:0;border-radius:14px;background:linear-gradient(180deg,#f6dc8d,#d4a53e);color:#1a1204;font-weight:800;font-size:15px}
.sh .why{margin:14px 0 0;padding:12px 14px;border-radius:14px;background:rgba(216,178,76,.07);color:var(--muted);font-size:13.5px}
.sh .why b{color:var(--gold-2)}
</style>
</head>
<body>
<script src="icones.js"></script>
<div class="wrap">
  <h1 class="ap-t">Inventaire repensé</h1>
  <p class="ap-p">Plus de grille de tuiles : une liste claire (combien tu as), une carte « Objectif » (est-ce que tu as assez) et « À retenir » (quoi en faire). Le détail s’ouvre quand tu touches une ligne. Deux façons de ranger la liste :</p>
  <div class="opt" id="opt">
    <button type="button" data-o="1" aria-pressed="true"><b>1 · Comme le jeu</b><small>les 6 onglets de l’Inventaire du jeu</small></button>
    <button type="button" data-o="2" aria-pressed="false"><b>2 · Par usage</b><small>construire, commandants, combat, équipement</small></button>
  </div>
  <div class="scr-h"><h1>Inventaire</h1><small>Exemples · mis à jour le 10 oct.</small></div>
  <div id="ecran"></div>
</div>
<div class="sheet" id="sheet" aria-hidden="true"><div class="sh" id="sh"></div></div>
<script>
(function(){
var CH='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg>';
var ic=function(id){return '<svg viewBox="0 0 64 64" aria-hidden="true"><use href="#'+id+'"/></svg>';};
var dots=function(L){return '<span class="dots">'+L.map(function(q){return '<i class="q-'+q+'"></i>';}).join('')+'</span>';};
/* ---------- données des exemples (HDV 24 → 25, VIP 17, réserve 22) ---------- */
var R={
 food:{n:'Nourriture',ic:'r-food',v:'48 M',sub:'32 M en ville · 16 M en caisses',need:'82,2 M',pct:58,det:[['En ville','32 M'],['Caisses de 500 000','× 18 · 9 M'],['Caisses de 150 000','× 32 · 4,8 M'],['Caisses de 50 000','× 44 · 2,2 M']],why:'<b>30,6 M</b> de nourriture en ville dépassent la protection de ta réserve (1,4 M) : un pillage peut les prendre.'},
 wood:{n:'Bois',ic:'r-wood',v:'41 M',sub:'27 M en ville · 14 M en caisses',need:'82,2 M',pct:50,det:[['En ville','27 M'],['Caisses de 500 000','× 16 · 8 M'],['Caisses de 150 000','× 28 · 4,2 M'],['Caisses de 50 000','× 36 · 1,8 M']]},
 stone:{n:'Pierre',ic:'r-stone',v:'18 M',sub:'12 M en ville · 6 M en caisses',need:'36 M',pct:50},
 gold:{n:'Or',ic:'r-gold',v:'9,2 M',sub:'6,1 M en ville · 3,1 M en caisses'},
 gems:{n:'Gemmes',ic:'r-gem',v:'185 430',sub:'184 930 en ville · 500 en caisses'},
 coffres:{n:'Coffres « Choisissez un »',ic:'p-chest',v:'7',sub:'jusqu’à 820 K de nourriture, au choix'},
 packs:{n:'Packs de ressources',ic:'p-pack',v:'2',sub:'≈ 9 125 au hasard'},
 build:{n:'Construction',ic:'a-build',v:'20 j 3 h',sub:'38 j 15 h avec les généraux',need:'126 j 8 h',pct:31},
 research:{n:'Recherche',ic:'a-research',v:'13 j 9 h',sub:'31 j 21 h avec les généraux'},
 train:{n:'Entraînement',ic:'a-train',v:'9 j',sub:'27 j 12 h avec les généraux'},
 heal:{n:'Soins',ic:'a-heal',v:'3 j 4 h',sub:'21 j 16 h avec les généraux'},
 general:{n:'Généraux',ic:'a-general',v:'18 j 12 h',sub:'utilisables pour tout'},
 att:{n:'Attaque +5 %',ic:'t-swords',v:'2 j',sub:'4 boosts de 12 h'},
 def:{n:'Défense +5 %',ic:'i-shield2',v:'1 j',sub:'2 boosts de 12 h'},
 trp:{n:'Troupes',ic:'n-banners',v:'2',sub:'expansions +25 % (4 h)'},
 cuir:{n:'Cuir',ic:'n-leather',v:'≈ 1 légendaire',sub:'31 % du suivant',q:['g','v','b'],qs:'120 · 30 · 6'},
 fer:{n:'Minerai de fer',ic:'n-ore',v:'≈ 0 légendaire',sub:'97 % du premier',q:['g','v','b'],qs:'96 · 22 · 4'},
 ebene:{n:'Ébène',ic:'n-ebony',v:'≈ 0 légendaire',sub:'59 % du premier',q:['g','v'],qs:'80 · 18'},
 os:{n:'Os d’animal',ic:'n-bone',v:'≈ 0 légendaire',sub:'79 % du premier',q:['g','v','b'],qs:'75 · 20 · 3'},
 plans:{n:'Plans',ic:'n-scroll',v:'9',sub:'',q:['b','v'],qs:'3 élites · 6 avancés'},
 frag:{n:'Fragments de plan',ic:'n-copy',v:'17',sub:'30 du même plan = 1 plan',q:['b','v'],qs:'5 · 12'},
 coffeq:{n:'Coffres à ouvrir',ic:'p-chest',v:'39',sub:'matériaux ou fragments'},
 pieces:{n:'Pièces forgées',ic:'n-armor',v:'5',sub:'',q:['b','v'],qs:'2 élites · 3 avancées'},
 att2:{n:'Pièces d’attirail',ic:'n-ring',v:'1 / 2 000',sub:'1 élite'},
 cform:{n:'Coffres au choix de formation',ic:'p-chest',v:'1',sub:'une pièce d’attirail au hasard'},
 sch:{n:'Sculptures au choix',ic:'i-crown',v:'12 légendaires',sub:'+ 30 épiques'},
 scm:{n:'Sculptures de commandants',ic:'i-person',v:'45 légendaires',sub:'+ 120 épiques'},
 ste:{n:'Sculptures de lumière d’étoile',ic:'n-star',v:'20 légendaires',sub:'+ 60 épiques · 150 élites · 300 avancées'},
 cscm:{n:'Coffres de sculptures',ic:'p-chest',v:'',sub:'à renseigner'},
 tomes:{n:'Tomes du savoir',ic:'n-book',v:'500 000 EXP',sub:'1 178 tomes'},
 pa:{n:'Points d’action',ic:'t-flask',v:'10 500',sub:'≈ 262 barbares niv. 25 · ≈ 655 K EXP par commandant',det:[['Potions de 500','× 4'],['Potions de 100','× 40'],['Potions de 50','× 90']],why:'Une attaque coûte 50 points, puis 40 en enchaînant. Chaque barbare de niveau 25 donne <b>2 500 EXP</b> à chacun de tes 2 commandants, et autant en tomes. Sans potion, le jeu te redonne environ <b>2 590 points par jour</b> (VIP 17) : tes potions en valent 4 jours.'},
 cles:{n:'Clés de la taverne',ic:'i-lock',v:'6',sub:'5 en argent · 1 en or'},
 constr:{n:'Château et tours de guet',ic:'i-keep',v:'50',sub:'20 livres d’alliance · 30 flèches de résistance'},
 migr:{n:'Migration',ic:'n-map',v:'',sub:'à renseigner'}};
function row(k){var r=R[k],need=r.need?'<small class="'+(r.pct>=100?'ok':'ko')+'">'+r.pct+' % de '+r.need+'</small>':'';
  var sub=(r.q?dots(r.q)+r.qs+(r.sub?' · ':''):'')+r.sub;
  return '<button type="button" class="row'+(r.v?'':' vide')+'" data-k="'+k+'"><span class="ri">'+ic(r.ic)+'</span><span class="rt"><b>'+r.n+'</b>'+(sub?'<small>'+sub+'</small>':'')+'</span>'+
    '<span class="rv"><b>'+(r.v||'—')+'</b>'+need+'</span><span class="ch">'+CH+'</span>'+(r.need?'<span class="tr"><i style="width:'+Math.min(100,r.pct)+'%"></i></span>':'')+'</button>';}
function grp(t,keys,note){return '<div class="grp"><h3>'+t+(note?'<small>'+note+'</small>':'')+'</h3><div class="list">'+keys.map(row).join('')+'</div></div>';}
/* carte objectif : est-ce que j'ai assez ? */
function goal(){function gi(t,v,p,ok){return '<div class="gi"><span>'+t+'</span><b class="'+(ok?'ok':'ko')+'">'+v+'</b><span class="tr'+(ok?' ok':'')+'"><i style="width:'+p+'%"></i></span></div>';}
  return '<div class="goal"><div class="k">Objectif</div><h2>Hôtel de ville 25</h2><div class="gl">'+
    gi('Nourriture','48 M / 82,2 M',58)+gi('Bois','41 M / 82,2 M',50)+gi('Pierre','18 M / 36 M',50)+
    gi('Accélérateurs (construction + généraux)','38 j / 126 j',31)+gi('Prérequis','Comptoir 24 ✓ · Mur 23 / 24',50)+
    '</div><a class="lk" href="#">Voir la progression '+CH.replace('<svg ','<svg width="14" height="14" ')+'</a></div>';}
/* à retenir : quoi en faire */
var MEM={
 res:[['ko','!','Il te manque <b>34 M de nourriture, 41 M de bois et 18 M de pierre</b> pour l’Hôtel de ville 25.'],['ko','!','<b>73 M de ressources en ville</b> dépassent la protection de ta réserve (niv. 22) : dépense-les ou garde-les en caisses.'],['info','i','Ouvre tes <b>7 coffres « Choisissez un »</b> en bois : c’est ce qui te manque le plus.']],
 acc:[['ko','!','Construction + généraux : <b>38 j 15 h</b>. L’Hôtel de ville 25 demande <b>126 j 8 h</b> sans bonus : tu en couvres 31 %.'],['info','i','Ton bonus de vitesse de construction n’est pas renseigné : la vraie durée sera plus courte.']],
 boosts:[['ok','✓','De quoi couvrir <b>2 jours d’attaque</b> et <b>1 jour de défense</b> +5 %.']],
 equip:[['ok','✓','Tu peux combiner ton cuir en <b>1 légendaire</b>.'],['info','i','Le minerai de fer est à <b>97 %</b> de son premier légendaire.']],
 attirail:[['info','i','<b>1 coffre de formation</b> à ouvrir.']],
 autre:[['ok','✓','<b>≈ 262 barbares</b> de niveau 25 à attaquer avec tes points d’action : <b>≈ 655 K EXP</b> pour chacun de tes 2 commandants.'],['info','i','<b>500 000 EXP</b> en tomes à donner à tes commandants.'],['info','i','<b>12 sculptures légendaires au choix</b> : garde-les pour ton commandant principal.']],
 construire:[['ko','!','Pour l’Hôtel de ville 25, il te manque <b>34 M de nourriture, 41 M de bois et 18 M de pierre</b>, et tes accélérateurs couvrent <b>31 %</b> du temps.'],['ko','!','<b>73 M de ressources en ville</b> dépassent la protection de ta réserve.']],
 cmd:[['ok','✓','<b>500 000 EXP</b> en tomes et <b>≈ 655 K EXP</b> par commandant avec tes points d’action (≈ 262 barbares niv. 25).']]};
function mem(L){return '<div class="mem"><h3>À retenir</h3>'+L.map(function(x){return '<div class="ins '+x[0]+'"><span class="d">'+x[1]+'</span><p>'+x[2]+'</p></div>';}).join('')+'</div>';}
var ONG=[['res','Ressources'],['acc','Accélérateurs'],['boosts','Boosts'],['equip','Équipement'],['attirail','Attirail'],['autre','Autre']],O='1',TAB='res';
var LISTE={res:grp('Ressources',['food','wood','stone','gold'],'en ville + en caisses')+grp('Gemmes, coffres et packs',['gems','coffres','packs']),
 acc:grp('Accélérateurs',['build','research','train','heal','general'],'durée totale'),
 boosts:grp('Boosts',['att','def','trp']),
 equip:grp('Matériaux',['cuir','fer','ebene','os'],'si tu combines tout')+grp('Plans et pièces',['plans','frag','coffeq','pieces']),
 attirail:grp('Attirail',['att2','cform']),
 autre:grp('Commandants',['sch','scm','ste','cscm','tomes'])+grp('Points d’action',['pa'])+grp('Divers',['cles','constr','migr'])};
function ecran(){var h;
  if(O==='1'){h='<div class="tabs">'+ONG.map(function(o){return '<button type="button" data-t="'+o[0]+'" aria-pressed="'+(o[0]===TAB)+'">'+o[1]+'</button>';}).join('')+'</div>'+
    '<div class="lay"><div>'+LISTE[TAB]+'</div><div class="side">'+(TAB==='res'||TAB==='acc'?goal():'')+mem(MEM[TAB])+'</div></div>';}
  else h='<div class="lay"><div>'+
    grp('Pour construire',['food','wood','stone','gold','build','general','coffres','packs','constr'],'objectif : Hôtel de ville 25')+
    grp('Pour tes commandants',['tomes','pa','sch','scm','ste','cscm'])+
    grp('Pour combattre',['att','def','trp','train','heal'])+
    grp('Pour l’équipement',['cuir','fer','ebene','os','plans','frag','coffeq','pieces','att2','cform'])+
    grp('Pour la recherche',['research'])+
    grp('Divers',['gems','cles','migr'])+
    '</div><div class="side">'+goal()+mem(MEM.construire.concat(MEM.cmd).concat(MEM.equip.slice(0,1)))+'</div></div>';
  document.getElementById('ecran').innerHTML=h;}
/* fenêtre du détail */
function ouvrir(k){var r=R[k],det=r.det||[['Total',r.v||'—']];
  document.getElementById('sh').innerHTML='<div class="sh-h"><span class="ri">'+ic(r.ic)+'</span><h2>'+r.n+'</h2><button type="button" data-x aria-label="Fermer">✕</button></div>'+
    '<div class="sh-big">'+(r.v||'—')+'</div><p class="sh-sub">'+r.sub+'</p>'+
    (r.need?'<div class="sh-l"><span>Pour l’Hôtel de ville 25</span><b>'+r.v+' / '+r.need+'</b><span class="tr"><i style="width:'+r.pct+'%"></i></span></div>':'')+
    det.map(function(d){return '<div class="sh-l"><span>'+d[0]+'</span><b>'+d[1]+'</b></div>';}).join('')+
    (r.why?'<p class="why">'+r.why+'</p>':'')+'<button type="button" class="btn" data-x>Modifier les nombres</button>';
  var s=document.getElementById('sheet');s.classList.add('on');s.setAttribute('aria-hidden','false');}
function fermer(){var s=document.getElementById('sheet');s.classList.remove('on');s.setAttribute('aria-hidden','true');}
document.addEventListener('click',function(e){var b;
  if((b=e.target.closest('#opt button'))){O=b.dataset.o;document.querySelectorAll('#opt button').forEach(function(x){x.setAttribute('aria-pressed',String(x===b));});ecran();return;}
  if((b=e.target.closest('.tabs button'))){TAB=b.dataset.t;ecran();return;}
  if((b=e.target.closest('.row'))){ouvrir(b.dataset.k);return;}
  if(e.target.closest('[data-x]')||e.target.id==='sheet')fermer();});
var q=new URLSearchParams(location.search);if(q.get('o'))O=q.get('o');if(q.get('t'))TAB=q.get('t');
document.querySelectorAll('#opt button').forEach(function(x){x.setAttribute('aria-pressed',String(x.dataset.o===O));});
ecran();
})();
</script>
</body>
</html>
