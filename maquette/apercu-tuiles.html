<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Aperçu des tuiles</title>
<!-- Page d'aperçu (2026-10-10) : 3 directions visuelles pour les tuiles d'objets de l'Inventaire, à choisir par Mickaël.
     Ce n'est pas l'appli : les nombres sont ceux de la version « Exemples ». À supprimer une fois la direction choisie et intégrée. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif:wght@700&family=Roboto:wght@400;500;600;700;800&display=swap">
<style>
:root{
  color-scheme:dark;
  --canvas:#05070d;--text:#f3ead6;--muted:#b1bbca;--faint:#7f8aa0;--gold:#d8b24c;--gold-2:#f3d982;
  --display:"Noto Serif",Georgia,serif;--body:Roboto,system-ui,-apple-system,"Segoe UI",sans-serif;
  --o1:#ffd98a;--o2:#e48a1c;--p1:#d6b0ff;--p2:#8a4fe0;--b1:#9ccfff;--b2:#2f78d6;--v1:#9de8a6;--v2:#2f9a47;--g1:#d3d9e2;--g2:#6b7686;
}
*{box-sizing:border-box}
html,body{margin:0}
body{min-height:100vh;color:var(--text);background:radial-gradient(1100px 520px at 50% -10%,rgba(216,178,76,.13),transparent 62%),linear-gradient(180deg,#08111d,#05070d);background-attachment:fixed;font:14px/1.4 var(--body);-webkit-font-smoothing:antialiased}
svg{display:block;flex:none}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
.wrap{max-width:1040px;margin:0 auto;padding:20px 16px 60px}

/* ---------- En-tête de l'aperçu ---------- */
.top{display:grid;gap:14px;margin-bottom:22px}
.top h1{margin:0;font:700 30px/1.1 var(--display);color:var(--gold-2)}
.top p{margin:0;color:var(--muted);max-width:640px}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg button{display:grid;gap:2px;min-width:150px;min-height:56px;padding:9px 16px;border:1px solid rgba(154,178,211,.22);border-radius:14px;background:#0d1626;text-align:left;transition:border-color .2s,background .2s,transform .2s}
.seg button b{font-size:15px}.seg button small{color:var(--muted);font-size:12.5px}
.seg button[aria-pressed="true"]{border-color:rgba(243,217,130,.7);background:linear-gradient(180deg,rgba(216,178,76,.18),rgba(216,178,76,.06));box-shadow:0 0 0 3px rgba(216,178,76,.12)}
.seg button[aria-pressed="true"] b{color:var(--gold-2)}
.replay{justify-self:start;display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 16px;border:1px solid rgba(154,178,211,.22);border-radius:12px;background:transparent;color:var(--muted)}
.replay svg{width:18px;height:18px}
.tab-t{margin:26px 0 12px;font:700 22px/1.2 var(--display)}

/* ---------- Grille ---------- */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.t.large{grid-column:1/-1}
@media(max-width:699px){.grid{grid-template-columns:minmax(0,1fr)}}

/* ---------- Tuile : matière commune (bord dégradé, lumière, reflet) ---------- */
.t{--glow:rgba(216,178,76,.16);position:relative;isolation:isolate;display:grid;align-content:start;gap:14px;min-width:0;padding:18px 18px 18px;border:1px solid transparent;border-radius:20px;overflow:hidden;text-align:left;
  background:
    radial-gradient(420px 220px at 100% 0%,var(--glow),transparent 70%) padding-box,
    linear-gradient(160deg,#1e2c42 0%,#141e30 55%,#101827 100%) padding-box,
    linear-gradient(165deg,rgba(243,217,130,.55),rgba(154,178,211,.10) 38%,rgba(154,178,211,.06) 70%,rgba(243,217,130,.25)) border-box;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 18px 36px -18px #000,0 2px 6px -2px #0008;
  transition:transform .35s cubic-bezier(.2,.8,.2,1),box-shadow .35s}
.t::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(255,255,255,.035),transparent 30%);pointer-events:none}
.t::after{content:"";position:absolute;top:0;bottom:0;left:-60%;width:45%;z-index:2;background:linear-gradient(100deg,transparent,rgba(255,240,200,.10) 45%,rgba(255,255,255,.16) 50%,rgba(255,240,200,.10) 55%,transparent);transform:skewX(-14deg);opacity:0;pointer-events:none}
.t:hover{transform:translateY(-3px);box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 26px 44px -20px #000,0 0 0 1px rgba(243,217,130,.18),0 0 34px -10px var(--glow)}
.t:hover::after,.t.shine::after{animation:sweep 1.1s cubic-bezier(.3,.6,.3,1) both}
@keyframes sweep{0%{left:-60%;opacity:0}15%{opacity:1}100%{left:120%;opacity:0}}
.t.go{animation:rise .7s cubic-bezier(.2,.8,.2,1) both;animation-delay:var(--d,0s)}
@keyframes rise{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}

/* en-tête : icône, titre, à quoi ça sert */
.th{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;column-gap:12px}
.th .ico{display:grid;place-items:center;width:48px;height:48px;border-radius:14px;background:radial-gradient(circle at 30% 25%,rgba(255,255,255,.14),rgba(255,255,255,.02) 60%),#0c1422;box-shadow:inset 0 0 0 1px rgba(243,217,130,.22),0 6px 14px -6px #000}
.th .ico svg{width:32px;height:32px;filter:drop-shadow(0 3px 4px #000a)}
.th h3{margin:0;color:#e7cf8f;font-size:12.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}
.th p{margin:3px 0 0;color:var(--muted);font-size:13.5px;line-height:1.35}
.th .chev{width:30px;height:30px;display:grid;place-items:center;border-radius:50%;color:var(--faint);background:rgba(255,255,255,.03)}
.th .chev svg{width:16px;height:16px}

/* grand nombre : or en dégradé */
.hero{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 10px;min-width:0}
.hero .n{font:700 44px/1 var(--display);letter-spacing:-.01em;font-variant-numeric:tabular-nums;white-space:nowrap;
  background:linear-gradient(180deg,#fff6d6 0%,#f3d982 45%,#c9952f 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 10px rgba(216,178,76,.22))}
.hero .u{color:#e9d9ad;font:700 19px/1 var(--display)}
.hero .apx{margin-right:-4px;color:#e9d9ad;font:700 26px/1 var(--display)}
.hero .sep{width:1px;height:26px;margin:0 6px;align-self:center;background:linear-gradient(180deg,transparent,rgba(243,217,130,.5),transparent)}
.note{margin-top:-6px;color:var(--muted);font-size:13px}
@media(max-width:699px){.hero .n{font-size:38px}}

/* état vide */
.vide{display:flex;align-items:center;gap:12px;padding:14px;border:1px dashed rgba(243,217,130,.28);border-radius:14px;background:rgba(216,178,76,.04)}
.vide .plus{display:grid;place-items:center;width:36px;height:36px;border-radius:50%;background:linear-gradient(180deg,rgba(243,217,130,.25),rgba(216,178,76,.08));color:var(--gold-2);font:700 22px/1 var(--body)}
.vide b{display:block;color:var(--gold-2)}.vide span{color:var(--muted);font-size:13px}

/* points de qualité */
.dq{width:10px;height:10px;border-radius:50%;flex:none;background:radial-gradient(circle at 35% 30%,var(--c1),var(--c2));box-shadow:0 0 8px var(--c2)}
.q-o{--c1:var(--o1);--c2:var(--o2)}.q-p{--c1:var(--p1);--c2:var(--p2)}.q-b{--c1:var(--b1);--c2:var(--b2)}.q-v{--c1:var(--v1);--c2:var(--v2)}.q-g{--c1:var(--g1);--c2:var(--g2)}

/* ===== Direction A : barre de rareté ===== */
.bar{display:flex;gap:3px;height:12px;padding:2px;border-radius:999px;background:#0a111d;box-shadow:inset 0 1px 3px #000c,0 1px 0 rgba(255,255,255,.04)}
.bar i{position:relative;display:block;min-width:6px;height:100%;border-radius:999px;background:linear-gradient(180deg,var(--c1),var(--c2));box-shadow:0 0 10px -2px var(--c2);transform-origin:left;overflow:hidden}
.bar i::after{content:"";position:absolute;inset:0 0 50% 0;border-radius:999px;background:linear-gradient(180deg,rgba(255,255,255,.45),rgba(255,255,255,0))}
.bar i.q-o::before{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.65) 50%,transparent 70%);background-size:250% 100%;animation:shim 2.8s ease-in-out infinite}
@keyframes shim{0%{background-position:150% 0}60%,100%{background-position:-100% 0}}
.go .bar i{animation:grow .9s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--d,0s) + .15s + var(--k,0)*.08s)}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.leg{display:flex;flex-wrap:wrap;gap:10px 18px}
.leg span{display:inline-flex;align-items:center;gap:8px;color:var(--muted);font-size:13.5px}
.leg b{color:var(--text);font-size:15px;font-variant-numeric:tabular-nums}
.leg .z{opacity:.45}

/* ===== Direction B : anneau ===== */
.ringrow{display:grid;grid-template-columns:118px minmax(0,1fr);align-items:center;gap:18px}
.ring{position:relative;width:118px;height:118px}
.ring svg{width:118px;height:118px;transform:rotate(-90deg);overflow:visible}
.ring circle{fill:none;stroke-width:11;stroke-linecap:round}
.ring .bg{stroke:#0a111d}
.ring .seg{filter:drop-shadow(0 0 5px var(--c2))}
.go .ring .seg{animation:draw 1.1s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--d,0s) + .15s + var(--k,0)*.12s)}
@keyframes draw{from{stroke-dasharray:0 999}}
.ring .c{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring .c b{font:700 24px/1 var(--display);color:var(--gold-2);font-variant-numeric:tabular-nums}
.ring .c small{margin-top:3px;color:var(--muted);font-size:12px}
.rl{display:grid;gap:8px}
.rl span{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:9px;color:var(--muted);font-size:13.5px}
.rl b{color:var(--text);font-size:15px;font-variant-numeric:tabular-nums}
.rl .z{opacity:.45}
@media(max-width:380px){.ringrow{grid-template-columns:100px minmax(0,1fr)}.ring,.ring svg{width:100px;height:100px}}

/* ===== Direction C : vitrine ===== */
.vit{display:grid;gap:11px}
.vit .r{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:end;row-gap:6px;column-gap:12px}
.vit .l{color:var(--c1);font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;text-shadow:0 0 12px var(--c2)}
.vit .v{font:700 20px/1 var(--display);color:var(--text);font-variant-numeric:tabular-nums}
.vit .tr{grid-column:1/-1;position:relative;height:5px;border-radius:999px;background:rgba(255,255,255,.05)}
.vit .tr i{position:absolute;inset:0 auto 0 0;border-radius:999px;background:linear-gradient(90deg,var(--c2),var(--c1));box-shadow:0 0 12px -1px var(--c2);transform-origin:left}
.vit .tr i::after{content:"";position:absolute;right:-3px;top:50%;width:11px;height:11px;margin-top:-5.5px;border-radius:50%;background:radial-gradient(circle,#fff 0,var(--c1) 40%,transparent 72%);box-shadow:0 0 12px 2px var(--c2)}
.go .vit .r{animation:slide .6s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--d,0s) + .1s + var(--k,0)*.09s)}
.go .vit .tr i{animation:grow 1s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--d,0s) + .25s + var(--k,0)*.09s)}
@keyframes slide{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:none}}
.vit .z .l,.vit .z .v{opacity:.4}.vit .z .tr i{display:none}
.t.cv{--aura:var(--o2)}
.t.cv::before{background:radial-gradient(360px 180px at 85% -10%,color-mix(in srgb,var(--aura) 30%,transparent),transparent 70%),linear-gradient(180deg,rgba(255,255,255,.035),transparent 30%);animation:breathe 5s ease-in-out infinite}
@keyframes breathe{50%{opacity:.6}}

/* ---------- Chiffres clés (points d'action) ---------- */
.kpi{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:1px solid rgba(243,217,130,.14);padding-top:14px}
.kpi>div{display:grid;align-content:start;gap:6px;padding:0 16px;border-left:1px solid rgba(154,178,211,.14)}
.kpi>div:first-child{padding-left:0;border-left:0}
.kpi .k{font:700 34px/1 var(--display);font-variant-numeric:tabular-nums;white-space:nowrap;background:linear-gradient(180deg,#fff6d6,#f3d982 45%,#c9952f);-webkit-background-clip:text;background-clip:text;color:transparent}
.kpi .k i{font-style:normal;font-size:.55em}
.kpi span{color:var(--muted);font-size:13.5px;line-height:1.35}
.kpi .kt{grid-column:1/-1;margin:-4px 0 12px;padding:0;border:0;color:#e7cf8f;font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}
@media(max-width:699px){.kpi{grid-template-columns:minmax(0,1fr);gap:12px}.kpi>div{grid-template-columns:118px minmax(0,1fr);align-items:center;padding:0;border-left:0}.kpi .k{font-size:28px}.kpi .kt{margin:0}}
.pa-body{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:22px;align-items:start}
@media(max-width:699px){.pa-body{grid-template-columns:minmax(0,1fr)}}
.pa-body .kpi{border-top:0;padding-top:0}
@media(min-width:700px){.pa-body .kpi{padding-left:22px;border-left:1px solid rgba(243,217,130,.14)}}

@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<script src="icones.js"></script>
<div class="wrap">
  <div class="top">
    <h1>Aperçu : tuiles de l’Inventaire</h1>
    <p>Trois directions pour l’intérieur des tuiles (onglet Autre, et Cuir pour l’Équipement). Les nombres sont ceux des exemples. Touche une tuile pour voir l’effet de lumière ; « Rejouer » relance les animations.</p>
    <div class="seg" role="group" aria-label="Direction">
      <button type="button" data-v="A" aria-pressed="true"><b>A · Barre de rareté</b><small>une barre en couleurs + la légende</small></button>
      <button type="button" data-v="B" aria-pressed="false"><b>B · Anneau</b><small>un cercle en couleurs + la liste</small></button>
      <button type="button" data-v="C" aria-pressed="false"><b>C · Vitrine</b><small>une ligne lumineuse par qualité</small></button>
    </div>
    <button class="replay" type="button" id="replay"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 4v4h4"/></svg>Rejouer les animations</button>
  </div>
  <h2 class="tab-t">Autre</h2>
  <div class="grid" id="g"></div>
  <h2 class="tab-t">Équipement (un exemple)</h2>
  <div class="grid" id="g2"></div>
</div>
<script>
(function(){
var NB=function(n){return String(n).replace(/\B(?=(\d{3})+(?!\d))/g,' ');};
var CHEV='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg>';
var ic=function(id){return '<svg viewBox="0 0 64 64" aria-hidden="true"><use href="#'+id+'"/></svg>';};
/* exemples de la maquette (version « Exemples ») */
var T=[
 {titre:'Sculptures au choix',ic:'i-crown',but:'À échanger contre le commandant de ton choix',hero:[[12,'légendaires']],P:[['o',12,'légendaires'],['p',30,'épiques']]},
 {titre:'Sculptures de commandants',ic:'i-person',but:'Pour obtenir ou améliorer un commandant précis',hero:[[45,'légendaires']],P:[['o',45,'légendaires'],['p',120,'épiques']]},
 {titre:'Sculptures de lumière d’étoile',ic:'n-star',but:'Pour monter les étoiles de tes commandants',hero:[[20,'légendaires']],P:[['o',20,'légendaires'],['p',60,'épiques'],['b',150,'élites'],['v',300,'avancées']]},
 {titre:'Coffres de sculptures',ic:'p-chest',but:'À ouvrir : des sculptures de commandants',vide:1},
 {titre:'Tomes du savoir',ic:'n-book',but:'EXP à donner à tes commandants',hero:[[500000,'EXP']],P:[['p',6,'de 10 000',60000],['p',12,'de 5 000',60000],['p',240,'de 1 000',240000],['b',120,'de 500',60000],['v',800,'de 100',80000]],x:'tomes',centre:['500 K','EXP']},
 {titre:'Clés',ic:'i-lock',but:'Pour ouvrir les coffres de la taverne',hero:[[6,'clés']],P:[['o',1,'en or'],['p',5,'en argent']]},
 {titre:'Points d’action',ic:'t-flask',but:'Pour attaquer les barbares',large:1,hero:[[10500,'points']],P:[['b',4,'de 500',2000],['v',40,'de 100',4000],['v',90,'de 50',4500]],x:'potions',centre:['134','potions'],
  kpi:[['262','barbares de niveau 25 à attaquer',1],['655 K','EXP pour chacun de tes 2 commandants',1],['4 j','le temps que le jeu met à te redonner ces points',1]]},
 {titre:'Château et tours de guet',ic:'i-keep',but:'Pour monter le château et les tours de guet',hero:[[20,'livres'],[30,'flèches']],P:[['v',20,'livres d’alliance'],['b',30,'flèches de résistance']]},
 {titre:'Migration',ic:'n-map',but:'Pour changer de royaume',vide:1}];
var T2=[{titre:'Cuir',ic:'n-leather',but:'Pour forger l’équipement de tes commandants',hero:[[1,'légendaire',1]],note:'si tu combines tout (4 = 1 de la qualité au-dessus)',P:[['o',0,'légendaires'],['p',0,'épiques'],['b',6,'élites'],['v',30,'avancés'],['g',120,'normaux']],zeros:1},
 {titre:'Minerai de fer',ic:'n-ore',but:'Pour forger l’équipement de tes commandants',hero:[[0,'légendaire',1]],note:'si tu combines tout (4 = 1 de la qualité au-dessus)',P:[['o',0,'légendaires'],['p',0,'épiques'],['b',4,'élites'],['v',22,'avancés'],['g',96,'normaux']],zeros:1}];
var V='A';
function poids(t,x){return x[1];}
function lab(t,x){return t.x?x[2]:x[2];}
function heroH(t){return '<div class="hero">'+t.hero.map(function(h,k){return (k?'<span class="sep"></span>':'')+(h[2]?'<span class="apx">≈</span>':'')+'<span class="n" data-n="'+h[0]+'">'+NB(h[0])+'</span><span class="u">'+h[1]+'</span>';}).join('')+'</div>'+(t.note?'<div class="note">'+t.note+'</div>':'');}
function legende(t){var L=t.P.filter(function(x){return x[1]||t.zeros;});
  if(V==='A')return '<div class="leg">'+L.map(function(x){return '<span class="'+(x[1]?'':'z')+'"><i class="dq q-'+x[0]+'"></i><b>'+NB(x[1])+'</b>'+(t.x?' '+t.x+' ':' ')+x[2]+'</span>';}).join('')+'</div>';
  if(V==='B')return '<div class="rl">'+L.map(function(x){return '<span class="'+(x[1]?'':'z')+'"><i class="dq q-'+x[0]+'"></i><em style="font-style:normal">'+(t.x?t.x.charAt(0).toUpperCase()+t.x.slice(1)+' ':'')+(t.x?x[2]:x[2].charAt(0).toUpperCase()+x[2].slice(1))+'</em><b>'+NB(x[1])+'</b></span>';}).join('')+'</div>';
  var mx=Math.max.apply(null,L.map(function(x){return poids(t,x);}).concat([1]));
  return '<div class="vit">'+L.map(function(x,k){return '<div class="r q-'+x[0]+(x[1]?'':' z')+'" style="--k:'+k+'"><span class="l">'+(t.x?t.x+' ':'')+x[2]+'</span><span class="v">'+NB(x[1])+'</span><span class="tr"><i style="width:'+Math.max(4,poids(t,x)/mx*100)+'%"></i></span></div>';}).join('')+'</div>';}
function corps(t){if(t.vide)return '<div class="vide"><span class="plus">+</span><span><b>À renseigner</b><span>Touche la tuile pour saisir ce que tu as.</span></span></div>';
  var L=t.P.filter(function(x){return x[1];}),tot=L.reduce(function(a,x){return a+poids(t,x);},0);
  if(V==='A')return heroH(t)+'<div class="bar">'+L.map(function(x,k){return '<i class="q-'+x[0]+'" style="flex:'+poids(t,x)+' 1 0;--k:'+k+'"></i>';}).join('')+'</div>'+legende(t);
  if(V==='B'){var R=46,C=2*Math.PI*R,gap=L.length>1?7:0,off=0;
    var segs=L.map(function(x,k){var len=Math.max(2,poids(t,x)/tot*C-gap),s='<circle class="seg q-'+x[0]+'" r="'+R+'" cx="59" cy="59" stroke="url(#gr-'+x[0]+')" stroke-dasharray="'+len.toFixed(1)+' '+C.toFixed(1)+'" stroke-dashoffset="'+(-off).toFixed(1)+'" style="--k:'+k+'"/>';off+=poids(t,x)/tot*C;return s;}).join('');
    var ce=t.centre||[NB(L.reduce(function(a,x){return a+x[1];},0)),'en tout'];
    return heroH(t)+'<div class="ringrow"><div class="ring"><svg viewBox="0 0 118 118"><circle class="bg" r="'+R+'" cx="59" cy="59"/>'+segs+'</svg><div class="c"><b>'+ce[0]+'</b><small>'+ce[1]+'</small></div></div>'+legende(t)+'</div>';}
  return heroH(t)+legende(t);}
function kpi(t){return '<div class="kpi"><div class="kt">Avec tes potions</div>'+t.kpi.map(function(k){return '<div><span class="k">'+(k[2]?'<i>≈ </i>':'')+k[0]+'</span><span>'+k[1]+'</span></div>';}).join('')+'</div>';}
function tuile(t,i){var top=t.P?(t.P.filter(function(x){return x[1];})[0]||[])[0]:null;var aura={o:'var(--o2)',p:'var(--p2)',b:'var(--b2)',v:'var(--v2)',g:'var(--g2)'}[top]||'var(--gold)';
  var glow={o:'rgba(228,138,28,.20)',p:'rgba(138,79,224,.20)',b:'rgba(47,120,214,.20)',v:'rgba(47,154,71,.18)',g:'rgba(150,160,175,.14)'}[top]||'rgba(216,178,76,.12)';
  var h='<div class="th"><span class="ico">'+ic(t.ic)+'</span><span><h3>'+t.titre+'</h3><p>'+t.but+'</p></span><span class="chev">'+CHEV+'</span></div>';
  var b=t.kpi?'<div class="pa-body"><div style="display:grid;gap:14px">'+corps(t)+'</div>'+kpi(t)+'</div>':corps(t);
  return '<button type="button" class="t go'+(t.large?' large':'')+(V==='C'?' cv':'')+'" style="--d:'+(i*0.06).toFixed(2)+'s;--glow:'+glow+';--aura:'+aura+'">'+h+b+'</button>';}
var DEFS='<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>'+['o','p','b','v','g'].map(function(q){return '<linearGradient id="gr-'+q+'" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="var(--'+q+'1)"/><stop offset="1" stop-color="var(--'+q+'2)"/></linearGradient>';}).join('')+'</defs></svg>';
document.body.insertAdjacentHTML('beforeend',DEFS);
function compte(){document.querySelectorAll('.hero .n[data-n]').forEach(function(e){var n=+e.dataset.n,pre='';if(!n){return;}var t0=null,d=900;
  function f(t){if(!t0)t0=t;var k=Math.min(1,(t-t0)/d),v=Math.round(n*(1-Math.pow(1-k,3)));e.innerHTML=pre+NB(v);if(k<1)requestAnimationFrame(f);}
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;requestAnimationFrame(f);});}
function rendre(){document.getElementById('g').innerHTML=T.map(tuile).join('');document.getElementById('g2').innerHTML=T2.map(function(t,i){return tuile(t,i+2);}).join('');compte();}
document.querySelectorAll('.seg button').forEach(function(b){b.addEventListener('click',function(){V=b.dataset.v;document.querySelectorAll('.seg button').forEach(function(x){x.setAttribute('aria-pressed',String(x===b));});rendre();});});
document.getElementById('replay').addEventListener('click',rendre);
document.addEventListener('click',function(e){var t=e.target.closest('.t');if(!t)return;t.classList.remove('shine');void t.offsetWidth;t.classList.add('shine');});
var q=new URLSearchParams(location.search).get('v');if(q&&/^[ABC]$/.test(q)){V=q;document.querySelectorAll('.seg button').forEach(function(x){x.setAttribute('aria-pressed',String(x.dataset.v===V));});}
rendre();
})();
</script>
