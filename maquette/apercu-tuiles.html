<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Aperçu des tuiles</title>
<!-- Page d'aperçu (2026-10-10) : tuiles d'objets de l'Inventaire, version « A + lignes lumineuses de C » demandée par Mickaël.
     Ce n'est pas l'appli : les nombres sont ceux de la version « Exemples ». À supprimer une fois la direction validée et intégrée. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif:wght@700&family=Roboto:wght@400;500;600;700;800&display=swap">
<style>
:root{
  color-scheme:dark;
  --text:#f3ead6;--muted:#b1bbca;--faint:#7f8aa0;--gold:#d8b24c;--gold-2:#f3d982;
  --display:"Noto Serif",Georgia,serif;--body:Roboto,system-ui,-apple-system,"Segoe UI",sans-serif;
  --o1:#ffe0a0;--o2:#ee9324;--p1:#dcb8ff;--p2:#9356ea;--b1:#a6d6ff;--b2:#3584e4;--v1:#a6efb0;--v2:#33a94e;--g1:#e2e7ee;--g2:#7d8899;
}
*{box-sizing:border-box}
html,body{margin:0}
body{min-height:100vh;color:var(--text);background:#05070d;font:14px/1.4 var(--body);-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(1100px 540px at 50% -12%,rgba(216,178,76,.14),transparent 62%),radial-gradient(700px 500px at 100% 100%,rgba(53,132,228,.06),transparent 70%),linear-gradient(180deg,#08111d,#05070d)}
svg{display:block;flex:none}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
.wrap{max-width:1040px;margin:0 auto;padding:22px 16px 70px}

/* ---------- en-tête de l'aperçu ---------- */
.top{display:grid;gap:12px;margin-bottom:8px}
.top h1{margin:0;font:700 30px/1.15 var(--display);color:var(--gold-2)}
.top p{margin:0;color:var(--muted);max-width:660px}
.replay{justify-self:start;display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 16px;border:1px solid rgba(154,178,211,.22);border-radius:12px;background:rgba(13,22,38,.7);color:var(--muted)}
.replay svg{width:18px;height:18px}
.tab-t{display:flex;align-items:center;gap:14px;margin:30px 0 14px;font:700 22px/1.2 var(--display)}
.tab-t::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,rgba(243,217,130,.35),transparent)}

/* ---------- grille ---------- */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;perspective:1100px}
.t.large{grid-column:1/-1}
@media(max-width:699px){.grid{grid-template-columns:minmax(0,1fr);gap:14px}}

/* ---------- tuile : matière, bord doré, lumière qui suit le doigt, légère inclinaison ---------- */
.t{--glow:rgba(216,178,76,.14);--mx:50%;--my:-20%;--rx:0deg;--ry:0deg;
  position:relative;isolation:isolate;display:grid;align-content:start;gap:16px;min-width:0;padding:20px;border:1px solid transparent;border-radius:22px;overflow:hidden;text-align:left;
  background:
    radial-gradient(520px 260px at 100% 0%,var(--glow),transparent 70%) padding-box,
    linear-gradient(160deg,#1f2d44 0%,#152034 52%,#0f1726 100%) padding-box,
    linear-gradient(165deg,rgba(243,217,130,.6),rgba(154,178,211,.10) 36%,rgba(154,178,211,.05) 70%,rgba(243,217,130,.28)) border-box;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 22px 40px -22px #000,0 3px 8px -3px #000a;
  transform:rotateX(var(--rx)) rotateY(var(--ry));transform-style:preserve-3d;transition:transform .5s cubic-bezier(.2,.8,.2,1),box-shadow .4s}
.t.on{transition:transform .08s linear,box-shadow .4s;box-shadow:inset 0 1px 0 rgba(255,255,255,.09),0 30px 50px -24px #000,0 0 0 1px rgba(243,217,130,.16),0 0 40px -14px var(--glow-c,rgba(216,178,76,.5))}
/* reflet en haut, lumière qui suit le doigt, bord qui s'allume près du doigt */
.t>.sh{position:absolute;inset:0;z-index:-1;pointer-events:none;background:linear-gradient(180deg,rgba(255,255,255,.04),transparent 32%)}
.t>.spot{position:absolute;inset:0;z-index:1;pointer-events:none;opacity:0;transition:opacity .35s;background:radial-gradient(300px circle at var(--mx) var(--my),rgba(255,236,190,.11),transparent 62%)}
.t>.edge{position:absolute;inset:-1px;z-index:3;pointer-events:none;border-radius:inherit;padding:1.5px;opacity:0;transition:opacity .35s;
  background:radial-gradient(220px circle at var(--mx) var(--my),rgba(255,226,150,.95),rgba(255,226,150,0) 65%);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0)}
.t.on>.spot,.t.on>.edge{opacity:1}
/* halo de la meilleure qualité, qui respire */
.t>.aura{position:absolute;right:-90px;top:-110px;z-index:-1;width:300px;height:260px;border-radius:50%;pointer-events:none;background:radial-gradient(closest-side,var(--aura,transparent),transparent);opacity:.22;filter:blur(8px);animation:breathe 6s ease-in-out infinite}
@keyframes breathe{50%{opacity:.12;transform:scale(.92)}}
/* entrée */
.t.go{animation:rise .8s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:var(--d,0s)}
@keyframes rise{from{opacity:0;transform:translateY(18px) scale(.98)}to{opacity:1;transform:none}}
/* poussière d'or (tuiles avec du légendaire) */
.dust{position:absolute;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.dust i{position:absolute;bottom:-6px;width:3px;height:3px;border-radius:50%;background:#ffe7a8;box-shadow:0 0 6px 1px rgba(255,200,100,.8);opacity:0;animation:mote var(--t,7s) linear infinite;animation-delay:var(--w,0s)}
@keyframes mote{0%{opacity:0;transform:translate(0,0)}12%{opacity:.85}70%{opacity:.5}100%{opacity:0;transform:translate(var(--x,10px),-190px)}}

/* ---------- en-tête de tuile ---------- */
.th{position:relative;z-index:2;display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;column-gap:14px}
.med{position:relative;display:grid;place-items:center;width:52px;height:52px;border-radius:50%;
  background:radial-gradient(circle at 34% 28%,#33476a,#121c2e 62%,#0a111d);
  box-shadow:0 0 0 1.5px rgba(243,217,130,.6),0 0 0 5px rgba(216,178,76,.07),0 10px 20px -10px #000,inset 0 2px 5px rgba(255,255,255,.1)}
.med::after{content:"";position:absolute;inset:-1.5px;border-radius:50%;background:conic-gradient(from 200deg,transparent 0 70%,rgba(255,244,210,.9) 78%,transparent 86%);-webkit-mask:radial-gradient(closest-side,transparent calc(100% - 1.5px),#000 calc(100% - 1.5px));mask:radial-gradient(closest-side,transparent calc(100% - 1.5px),#000 calc(100% - 1.5px));animation:spin 9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.med svg{width:32px;height:32px;filter:drop-shadow(0 3px 4px #000b)}
.th h3{margin:0;color:#ecd393;font-size:12.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase}
.th p{margin:4px 0 0;color:var(--muted);font-size:13.5px;line-height:1.35}
.chev{display:grid;place-items:center;width:32px;height:32px;border-radius:50%;color:#c9b27a;background:rgba(243,217,130,.06);box-shadow:inset 0 0 0 1px rgba(243,217,130,.14)}
.chev svg{width:16px;height:16px}

/* ---------- grand nombre : or avec reflet ---------- */
.hero{position:relative;z-index:2;display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 10px}
.hero .n{font:700 48px/1 var(--display);letter-spacing:-.01em;font-variant-numeric:tabular-nums;white-space:nowrap;
  background:linear-gradient(105deg,#c58e2a 0%,#f0d17c 28%,#fff8de 42%,#f0d17c 56%,#c58e2a 100%);background-size:260% 100%;background-position:100% 0;
  -webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 14px rgba(216,178,76,.28));animation:glint 7s ease-in-out infinite;animation-delay:var(--gd,1s)}
@keyframes glint{0%,62%{background-position:100% 0}80%,100%{background-position:0% 0}}
.hero .u{color:#ead9ab;font:700 20px/1 var(--display)}
.hero .ap{color:#ead9ab;font:700 26px/1 var(--display);margin-right:-4px}
.hero .sep{width:1px;height:28px;margin:0 8px;align-self:center;background:linear-gradient(180deg,transparent,rgba(243,217,130,.55),transparent)}
.note{position:relative;z-index:2;margin-top:-8px;color:var(--muted);font-size:13px}
.note b{color:var(--gold-2);font-weight:700}
@media(max-width:699px){.hero .n{font-size:40px}.t{padding:18px}}

/* ---------- barre lumineuse (A + lignes de C) ---------- */
.lum{position:relative;z-index:2;display:flex;align-items:center;gap:10px;height:18px;padding:0 6px 0 0}
.lum::before{content:"";position:absolute;left:0;right:0;top:50%;height:6px;margin-top:-3px;border-radius:3px;background:rgba(5,9,17,.9);box-shadow:inset 0 1px 3px #000,0 1px 0 rgba(255,255,255,.05)}
.lum i{position:relative;flex:var(--w) 1 0;min-width:12px;height:4px;border-radius:2px;
  background:linear-gradient(90deg,color-mix(in srgb,var(--c2) 70%,transparent),var(--c1));box-shadow:0 0 12px 1px var(--c2),0 0 3px var(--c1);transform-origin:left}
.lum i::after{content:"";position:absolute;right:-6px;top:50%;width:14px;height:14px;margin-top:-7px;border-radius:50%;background:radial-gradient(circle,#fff 0,var(--c1) 32%,transparent 70%);box-shadow:0 0 16px 4px color-mix(in srgb,var(--c2) 75%,transparent)}
.lum i.q-o{background:linear-gradient(90deg,color-mix(in srgb,var(--c2) 70%,transparent),var(--c1),#fff6dc,var(--c1));background-size:300% 100%;animation:flow 3.2s linear infinite}
@keyframes flow{to{background-position:-300% 0}}
.lum .comet{position:absolute;top:50%;left:0;width:70px;height:12px;margin-top:-6px;border-radius:50%;pointer-events:none;
  background:radial-gradient(closest-side,rgba(255,255,255,.95),rgba(255,236,190,.35) 45%,transparent);mix-blend-mode:screen;opacity:0;animation:comet 5s cubic-bezier(.45,0,.25,1) infinite;animation-delay:var(--cd,2s)}
@keyframes comet{0%{opacity:0;left:-12%}8%{opacity:1}55%{opacity:.9;left:96%}62%,100%{opacity:0;left:100%}}
.go .lum i{animation:grow 1.1s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--d,0s) + .25s + var(--k,0)*.1s)}
.go .lum i.q-o{animation:grow 1.1s cubic-bezier(.2,.8,.2,1) both,flow 3.2s linear infinite;animation-delay:calc(var(--d,0s) + .25s + var(--k,0)*.1s),0s}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.lum.vide::before{background:repeating-linear-gradient(90deg,rgba(243,217,130,.25) 0 10px,transparent 10px 18px);box-shadow:none;height:2px;margin-top:-1px}

/* ---------- bandeau des qualités (couleurs de C) ---------- */
.strip{position:relative;z-index:2;display:flex;flex-wrap:wrap;gap:14px 30px}
.strip span{display:grid;gap:5px;min-width:0}
.strip em{font-style:normal;color:var(--c1);font-size:12px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;text-shadow:0 0 12px var(--c2);white-space:nowrap}
.strip b{font:700 24px/1 var(--display);color:var(--text);font-variant-numeric:tabular-nums;text-shadow:0 2px 10px rgba(0,0,0,.5)}
.strip .z{opacity:.38}
.strip .z em{text-shadow:none}
@media(max-width:699px){.strip{gap:12px 22px}.strip b{font-size:21px}}

/* couleurs de qualité */
.q-o{--c1:var(--o1);--c2:var(--o2)}.q-p{--c1:var(--p1);--c2:var(--p2)}.q-b{--c1:var(--b1);--c2:var(--b2)}.q-v{--c1:var(--v1);--c2:var(--v2)}.q-g{--c1:var(--g1);--c2:var(--g2)}
.q-gold{--c1:#fff0c4;--c2:#d8a032}

/* ---------- état vide ---------- */
.vide-b{position:relative;z-index:2;display:flex;align-items:center;gap:12px;color:var(--muted);font-size:13.5px}
.vide-b .plus{flex:none;white-space:nowrap;display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 16px;border-radius:999px;color:#1a1204;font-weight:800;
  background:linear-gradient(180deg,#f6dc8d,#d4a53e);box-shadow:0 0 0 1px rgba(255,240,200,.5) inset,0 6px 18px -6px rgba(216,165,62,.7)}

/* ---------- points d'action : chiffres clés ---------- */
.pa-body{position:relative;z-index:2;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:24px;align-items:stretch}
.pa-l{display:grid;align-content:start;gap:16px}
.kpi{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));align-content:start;gap:0;padding-left:24px;border-left:1px solid rgba(243,217,130,.16)}
.kpi .kt{grid-column:1/-1;margin-bottom:14px;color:#ecd393;font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase}
.kp{display:grid;align-content:start;gap:7px;padding:0 16px;border-left:1px solid rgba(154,178,211,.12)}
.kp:nth-child(2){padding-left:0;border-left:0}
.kp em{font-style:normal;color:var(--c1);font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;text-shadow:0 0 12px var(--c2)}
.kp b{font:700 36px/1 var(--display);white-space:nowrap;font-variant-numeric:tabular-nums;
  background:linear-gradient(180deg,#fff6d6,#f3d982 45%,#c9952f);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 12px rgba(216,178,76,.25))}
.kp b small{font-size:.55em}.kp b .kn{font-style:normal}
.kp>span{color:var(--muted);font-size:13.5px;line-height:1.35}
.kp .ln{position:relative;width:46px;height:3px;margin-top:4px;border-radius:2px;background:linear-gradient(90deg,transparent,var(--c1));box-shadow:0 0 10px var(--c2)}
.kp .ln::after{content:"";position:absolute;right:-5px;top:50%;width:10px;height:10px;margin-top:-5px;border-radius:50%;background:radial-gradient(circle,#fff,var(--c1) 35%,transparent 70%)}
@media(max-width:699px){.pa-body{grid-template-columns:minmax(0,1fr)}
  .kpi{grid-template-columns:minmax(0,1fr);gap:14px;padding:16px 0 0;border-left:0;border-top:1px solid rgba(243,217,130,.16)}
  .kpi .kt{margin-bottom:0}
  .kp{grid-template-columns:120px minmax(0,1fr);grid-template-areas:"e e" "b s";column-gap:12px;row-gap:6px;padding:0;border-left:0}
  .kp em{grid-area:e}.kp b{grid-area:b;font-size:30px}.kp>span{grid-area:s}.kp .ln{display:none}}

@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.t{transform:none!important}}
</style>
</head>
<body>
<script src="icones.js"></script>
<div class="wrap">
  <div class="top">
    <h1>Aperçu : la A avec les lignes lumineuses de la C</h1>
    <p>Pose le doigt sur une tuile et fais-le glisser : la lumière et le bord doré le suivent, la tuile s’incline un peu. Les tuiles qui ont du légendaire ont de la poussière d’or. Les nombres sont ceux des exemples.</p>
    <button class="replay" type="button" id="replay"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 4v4h4"/></svg>Rejouer les animations</button>
  </div>
  <h2 class="tab-t">Autre</h2>
  <div class="grid" id="g"></div>
  <h2 class="tab-t">Équipement</h2>
  <div class="grid" id="g2"></div>
</div>
<script>
(function(){
var NB=function(n){return String(n).replace(/\B(?=(\d{3})+(?!\d))/g,' ');};
var CHEV='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg>';
var ic=function(id){return '<svg viewBox="0 0 64 64" aria-hidden="true"><use href="#'+id+'"/></svg>';};
var RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
/* exemples de la maquette (version « Exemples ») ; P = [qualité, nombre, libellé] */
var T=[
 {titre:'Sculptures au choix',ic:'i-crown',but:'À échanger contre le commandant de ton choix',hero:[[12,'légendaires']],P:[['o',12,'Légendaires'],['p',30,'Épiques']]},
 {titre:'Sculptures de commandants',ic:'i-person',but:'Pour obtenir ou améliorer un commandant précis',hero:[[45,'légendaires']],P:[['o',45,'Légendaires'],['p',120,'Épiques']]},
 {titre:'Sculptures de lumière d’étoile',ic:'n-star',but:'Pour monter les étoiles de tes commandants',hero:[[20,'légendaires']],P:[['o',20,'Légendaires'],['p',60,'Épiques'],['b',150,'Élites'],['v',300,'Avancées']]},
 {titre:'Coffres de sculptures',ic:'p-chest',but:'À ouvrir : des sculptures de commandants',vide:1},
 {titre:'Tomes du savoir',ic:'n-book',but:'EXP à donner à tes commandants',hero:[[500000,'EXP']],P:[['p',6,'10 000 EXP'],['p',12,'5 000 EXP'],['p',240,'1 000 EXP'],['b',120,'500 EXP'],['v',800,'100 EXP']]},
 {titre:'Clés',ic:'i-lock',but:'Pour ouvrir les coffres de la taverne',hero:[[6,'clés']],P:[['o',1,'En or'],['p',5,'En argent']]},
 {titre:'Points d’action',ic:'t-flask',but:'Pour attaquer les barbares',large:1,hero:[[10500,'points']],P:[['b',4,'Potions de 500'],['v',40,'Potions de 100'],['v',90,'Potions de 50']],
  kpi:[['q-o','Barbares','262','de niveau 25 à attaquer'],['q-p','EXP','655','pour chacun de tes 2 commandants','K'],['q-b','Recharge','4','jours : le temps que le jeu met à te redonner ces points','j']]},
 {titre:'Château et tours de guet',ic:'i-keep',but:'Pour monter le château et les tours de guet',hero:[[20,'livres'],[30,'flèches']],P:[['v',20,'Livres d’alliance'],['b',30,'Flèches de résistance']]},
 {titre:'Migration',ic:'n-map',but:'Pour changer de royaume',vide:1}];
/* matériaux : 4 d'une qualité = 1 au-dessus ; part du prochain légendaire = reste / 256 en équivalent normal */
function mat(titre,icone,Q){var u=Q.g+4*Q.v+16*Q.b+64*Q.p+256*Q.o,lg=Math.floor(u/256),pct=Math.round(u%256/256*100);
  return {titre:titre,ic:icone,but:'Pour forger l’équipement de tes commandants',hero:[[lg,lg>1?'légendaires':'légendaire',1]],
    note:'si tu combines tout (4 = 1 de la qualité au-dessus) · déjà <b>'+pct+' %</b> du suivant',zeros:1,
    P:[['o',Q.o,'Légendaires'],['p',Q.p,'Épiques'],['b',Q.b,'Élites'],['v',Q.v,'Avancés'],['g',Q.g,'Normaux']]};}
var T2=[mat('Cuir','n-leather',{o:0,p:0,b:6,v:30,g:120}),mat('Minerai de fer','n-ore',{o:0,p:0,b:4,v:22,g:96})];
var AURA={o:'rgba(238,147,36,.9)',p:'rgba(147,86,234,.9)',b:'rgba(53,132,228,.9)',v:'rgba(51,169,78,.85)',g:'rgba(150,160,175,.6)'};
var GLOW={o:'rgba(238,147,36,.17)',p:'rgba(147,86,234,.17)',b:'rgba(53,132,228,.17)',v:'rgba(51,169,78,.15)',g:'rgba(150,160,175,.12)'};
function heroH(t){return '<div class="hero">'+t.hero.map(function(h,k){return (k?'<span class="sep"></span>':'')+(h[2]?'<span class="ap">≈</span>':'')+'<span class="n" data-n="'+h[0]+'">'+NB(h[0])+'</span><span class="u">'+h[1]+'</span>';}).join('')+'</div>'+(t.note?'<div class="note">'+t.note+'</div>':'');}
function barre(t,i){var L=t.P.filter(function(x){return x[1];});
  return '<div class="lum">'+L.map(function(x,k){return '<i class="q-'+x[0]+'" style="--w:'+x[1]+';--k:'+k+'"></i>';}).join('')+'<span class="comet" style="--cd:'+(2+i*0.7).toFixed(1)+'s"></span></div>';}
function bandeau(t){return '<div class="strip">'+t.P.filter(function(x){return x[1];}).map(function(x){return '<span class="q-'+x[0]+(x[1]?'':' z')+'"><em>'+x[2]+'</em><b data-n="'+x[1]+'">'+NB(x[1])+'</b></span>';}).join('')+'</div>';}
function poussiere(){var h='';for(var k=0;k<7;k++)h+='<i style="left:'+(8+Math.random()*84).toFixed(0)+'%;--t:'+(6+Math.random()*5).toFixed(1)+'s;--w:'+(Math.random()*7).toFixed(1)+'s;--x:'+(Math.random()*40-20).toFixed(0)+'px"></i>';return '<span class="dust">'+h+'</span>';}
function kpi(t){return '<div class="kpi"><div class="kt">Avec tes potions</div>'+t.kpi.map(function(k){return '<div class="kp '+k[0]+'"><em>'+k[1]+'</em><b><small>≈ </small><i class="kn" data-n="'+k[2]+'">'+k[2]+'</i>'+(k[4]?'<small> '+k[4]+'</small>':'')+'</b><span>'+k[3]+'</span><i class="ln"></i></div>';}).join('')+'</div>';}
function tuile(t,i){var top=t.P?(t.P.filter(function(x){return x[1];})[0]||[])[0]:null;
  var h='<span class="sh"></span><span class="aura"></span>'+(top==='o'?poussiere():'')+'<span class="spot"></span><span class="edge"></span>'+
    '<div class="th"><span class="med">'+ic(t.ic)+'</span><span><h3>'+t.titre+'</h3><p>'+t.but+'</p></span><span class="chev">'+CHEV+'</span></div>';
  var b;
  if(t.vide)b='<div class="lum vide"></div><div class="vide-b"><span class="plus">+ À renseigner</span><span>Touche la tuile pour saisir ce que tu as.</span></div>';
  else if(t.kpi)b='<div class="pa-body"><div class="pa-l">'+heroH(t)+barre(t,i)+bandeau(t)+'</div>'+kpi(t)+'</div>';
  else b=heroH(t)+barre(t,i)+bandeau(t);
  return '<button type="button" class="t go'+(t.large?' large':'')+'" style="--d:'+(i*0.07).toFixed(2)+'s;--gd:'+(1.5+i*0.9).toFixed(1)+'s;--glow:'+(GLOW[top]||'rgba(216,178,76,.10)')+';--aura:'+(AURA[top]||'rgba(216,178,76,.5)')+';--glow-c:'+(AURA[top]||'rgba(216,178,76,.5)')+'">'+h+b+'</button>';}
/* les nombres comptent jusqu'à leur valeur */
function compte(root){if(RM)return;root.querySelectorAll('[data-n]').forEach(function(e,j){var n=+e.dataset.n;if(!n)return;var t0=null,d=1000+Math.min(600,j*20);e.textContent='0';
  function f(t){if(!t0)t0=t;var k=Math.min(1,(t-t0)/d),v=Math.round(n*(1-Math.pow(1-k,4)));e.textContent=NB(v);if(k<1)requestAnimationFrame(f);}
  setTimeout(function(){requestAnimationFrame(f);},250);});}
/* lumière qui suit le doigt et légère inclinaison */
function suivre(t){var r=null;
  function bouge(x,y){if(!r)r=t.getBoundingClientRect();var px=(x-r.left)/r.width,py=(y-r.top)/r.height,amp=t.classList.contains('large')?2.2:4.5;
    t.style.setProperty('--mx',(px*100).toFixed(1)+'%');t.style.setProperty('--my',(py*100).toFixed(1)+'%');
    if(!RM){t.style.setProperty('--ry',((px-.5)*amp).toFixed(2)+'deg');t.style.setProperty('--rx',((.5-py)*amp).toFixed(2)+'deg');}}
  function fin(){t.classList.remove('on');t.style.setProperty('--rx','0deg');t.style.setProperty('--ry','0deg');r=null;}
  t.addEventListener('pointerenter',function(e){r=null;t.classList.add('on');bouge(e.clientX,e.clientY);});
  t.addEventListener('pointerdown',function(e){r=null;t.classList.add('on');bouge(e.clientX,e.clientY);});
  t.addEventListener('pointermove',function(e){t.classList.add('on');bouge(e.clientX,e.clientY);});
  t.addEventListener('pointerleave',fin);t.addEventListener('pointercancel',fin);
  t.addEventListener('pointerup',function(e){if(e.pointerType!=='mouse')setTimeout(fin,350);});}
function rendre(){var g=document.getElementById('g'),g2=document.getElementById('g2');g.innerHTML=T.map(tuile).join('');g2.innerHTML=T2.map(function(t,i){return tuile(t,i+3);}).join('');
  document.querySelectorAll('.t').forEach(suivre);compte(document);}
document.getElementById('replay').addEventListener('click',rendre);
rendre();
})();
</script>
